            if(wallsAfter <= 0) score -= 120 * profile.weights.patience;
            else if(wallsAfter === 1) score -= 55 * profile.weights.patience;
            else if(wallsAfter === 2) score -= 18 * profile.weights.patience;
        }

        // 初手の無駄壁を明確に避ける。
        if(!options.urgent && totalTurnCount <= 2) {
            score -= 60 * profile.weights.patience;
            if(oppDelay >= 3 && future?.value > 70) score += 22 * profile.weights.block;
        }

        // まだ「今すぐ壁を使う必要がない」なら、移動を優先できるようにする。
        if(!options.urgent && oppDelay <= 0 && (!future || future.value < 35)) {
            score -= 45 * profile.weights.patience;
        }

        // 緊急時のみ温存を捨て、組み合わせによる時間稼ぎを最大化する。
        if(options.urgent) {
            score += oppDelay * 85;
            if(oppOptionsAfter <= 1) score += 45;
            if(wallsAfter === 0) score += 10;
            if(future?.value > 0) score += future.value * 0.55;
        }

        // 性格ごとの補正。
        if(options.personality === 'rush') {
            score -= Math.max(0, selfCost) * 30 * profile.weights.race;
            score -= 14 * profile.weights.block;
        }

        if(options.personality === 'trap') {
            if(strategy === 'swim' || strategy === 'twoChoiceSwim') score += 24 * profile.weights.trap;
            if(future?.second) score += 18 * profile.weights.trap;
        }

        if(options.personality === 'patient') {
            if(!options.urgent) {
                score -= 22 * profile.weights.patience;
                if(totalTurnCount >= 6 && future?.value > 45) score += 20 * profile.weights.patience;
            }
        }

        if(options.personality === 'comeback' && baseMyDist > baseOppDist) {
            if(future?.value > 35) score += 28 * profile.weights.comeback;
        }

        if(options.personality === 'fortress') {
            if(selfCost === 0) score += 10 * profile.weights.defense;
            if(oppOptionsAfter < oppOptionsBefore) score += 8 * profile.weights.block;
        }

        if(options.personality === 'ambush') {
            if(oppDelay >= 2 && future?.value > 20) score += 32 * profile.weights.tempo;
            if(selfCost <= 0) score += 30 * profile.weights.race;
            if(selfCost > 1) score -= 65 * profile.weights.race;
            const ownBranches = getRouteBranchProfile(who, tempWalls);
            if(ownBranches.count >= 2) score += 24 * profile.weights.ambush;
            if(newOppDist <= newMyDist) score += 18 * profile.weights.tempo;
        }

        if(options.personality === 'fortress') {
            const ownBranches = getRouteBranchProfile(who, tempWalls);
            if(selfCost === 0) score += 38 * profile.weights.defense;
            if(selfCost < 0) score += 18 * profile.weights.defense;
            if(ownBranches.count >= 2) score += 30 * profile.weights.defense;
            if(ownBranches.count === 1) score -= 25 * profile.weights.defense;
        }

        if(options.personality === 'rush') {
            const ownBranches = getRouteBranchProfile(who, tempWalls);
            if(selfCost <= 0) score += 36 * profile.weights.race;
            if(ownBranches.count >= 3) score += 48 * profile.weights.tempo;
            else if(ownBranches.count === 2) score += 20 * profile.weights.tempo;
            else score -= 40 * profile.weights.race;
            score += Math.max(0, oppDelay - selfCost) * 24 * profile.weights.tempo;
        }

        if(options.personality === 'trap') {
            if(strategy === 'twoChoice' || strategy === 'twoChoiceSwim' || strategy === 'swim') score += 48 * profile.weights.trap;
            if(oppOptionsAfter >= 2) score += 24 * profile.weights.trap;
            if(oppDelay <= 1 && selfCost <= 0) score += 34 * profile.weights.patience;
            if(oppDelay >= 3 && !options.urgent) score -= 38 * profile.weights.patience;
        }

        if(options.personality === 'patient') {
            const related = (profile.patternMemory || []).filter(m => m.signature === getAISignature(who));
            if(!options.urgent) {
                if(related.some(m => m.result === 'loss' && m.actionType === 'wall')) score -= 34 * profile.weights.patience;
                if(related.some(m => m.result === 'win' && m.actionType === 'wall')) score += 28 * profile.weights.patience;
            }
        }

        if(options.personality === 'trickster' && oppDelay <= 1 && oppOptionsAfter >= 2) {
            score += 15 * profile.weights.trick;
        }

        // 全プレイヤーの共有経験を参照する。
        // 以前この局面に似た状態で失敗率が高かった壁は下げ、
        // 成功率が高かった壁は上げる。ただし緊急防御・合法性判定より下位。
        score += getSharedExperienceScore(who, {
            type: 'wall',
            wall: candidate.wallInfo,
            strategy
        }, buildAIExperienceSituation(who));

        // 「今の壁1枚」だけで決めず、移動を含む将来価値が十分に高い時だけ採用。
        const minimumWallAdvantage = options.urgent ? -Infinity :
            (totalTurnCount <= 2 ? 55 : (state.myWalls.length <= 2 ? 38 : 24));

        if(score > best?.score && (options.urgent || score >= minimumWallAdvantage)) {
            best = {
                wallInfo: { ...wall, owner: who },
                wIdx: candidate.wIdx,
                score,
                oppDelay,
                selfCost,
                blocksImmediateWin: item.blocksImmediateWin,
                strategy,
                trapPlan: trapPlanSafe(candidate, who, strategy),
                futurePlan: future ? {
                    secondWall: future.second ? { ...future.second.wallInfo } : null,
                    opponentReply: future.opponentReply ? { ...future.opponentReply } : null,
                    ownMove: future.ownMove ? { ...future.ownMove } : null,
                    value: future.value
                } : null
            };
        }
    }

    return best;
}

function trapPlanSafe(candidate, who, strategy) {
    if(strategy !== 'trap') return null;
    return {
        enabled: true,
        owner: who,
        setupWallIndex: candidate.wIdx
    };
}

function evaluateTrapSetup(who, candidate, newOppPath, baseOppDist, options) {
    const state = getMyState(who);
    if(!newOppPath || newOppPath.length < 2) return null;

    // 現在は「あえて相手の最短路を大きく伸ばさない壁」を置き、
    // 相手がそのルートを選んだ次のターンに、別の壁で塞げるかを先読みする。
    const oppNext = newOppPath[1];
    const futureWalls = state.myWalls.filter((_, idx) => idx !== candidate.wIdx);
    if(futureWalls.length === 0) return null;

    let bestFutureDelay = 0;

    // 罠の二手目は相手の次の移動先周辺を中心に限定探索する。
    for(let wIdx = 0; wIdx < futureWalls.length; wIdx++) {
        const wallData = futureWalls[wIdx];
        for(let dr = -2; dr <= 2; dr++) {
            for(let dc = -2; dc <= 2; dc++) {
                const r = oppNext.r + dr;
                const c = oppNext.c + dc;
                if(r < 0 || r > boardSize || c < 0 || c > boardSize) continue;

                for(let rot of [0, 90, 180, 270]) {
                    const wallInfo = getWallInfo(r, c, wallData, rot);
                    const setupWalls = [...placedWalls, candidate.wallInfo];
                    if(!isValidWallPlacementWithWalls(wallInfo.segments, setupWalls)) continue;

                    const futureWallsList = [...setupWalls, wallInfo];
                    const futureOppPath = getShortestPath(oppNext, state.oppTargetRow, futureWallsList);
                    if(!futureOppPath) continue;

                    const delay = (futureOppPath.length - 1) - (newOppPath.length - 1);
                    if(delay > bestFutureDelay) bestFutureDelay = delay;
                }
            }
        }
    }

    // 「今はほぼ開いている」＋「次に大きく塞げる」を満たす時だけ罠と認定。
    const currentDelay = (newOppPath.length - 1) - baseOppDist;
    if(currentDelay <= 1 && bestFutureDelay >= 2) {
        return {
            score: 55 + bestFutureDelay * 22 - Math.max(0, currentDelay) * 4
        };
    }
    return null;
}

function getValidMovesWithWalls(pos, walls) {
    const dirs = [{r:-1,c:0},{r:1,c:0},{r:0,c:-1},{r:0,c:1}];
    const valid = [];
    dirs.forEach(d => {
        const target = {r: pos.r + d.r, c: pos.c + d.c};
        if(target.r >= 0 && target.r < boardSize &&
           target.c >= 0 && target.c < boardSize &&
           !isWallBlockingWithList(pos, target, walls)) {
            valid.push(target);
        }
    });
    return valid;
}

function getAIWallKey(wallInfo) {
    if(!wallInfo || !wallInfo.segments) return '';
    return wallInfo.segments.map(seg => `${seg.r1},${seg.c1},${seg.r2},${seg.c2}`).sort().join('|');
}
function isAIWallRecentlyUsed(who, wallInfo) {
    return (aiLearningState[who]?.recentActions || []).includes(`wall:${getAIWallKey(wallInfo)}`);
}
function isAIMoveRecentlyUsed(who, move) {
    return (aiLearningState[who]?.recentActions || []).includes(`move:${move.r},${move.c}`);
}
function getAIMoveVisitCount(who, move) {
    const st = aiLearningState[who];
    if(!st || !move) return 0;
    return st.positionVisits?.[`${move.r},${move.c}`] || 0;
}

function recordAIPosition(who, pos) {
    const st = aiLearningState[who];
    if(!st || !pos) return;
    st.positionVisits = st.positionVisits || {};
    st.lastPositions = st.lastPositions || [];

    const key = `${pos.r},${pos.c}`;
    st.positionVisits[key] = (st.positionVisits[key] || 0) + 1;
    st.lastPositions.push(key);
    if(st.lastPositions.length > 12) st.lastPositions.shift();

    st.loopDetected = false;
    const n = st.lastPositions.length;
    for(const period of [2,3,4]) {
        if(n < period * 2) continue;
        let same = true;
        for(let i = 0; i < period; i++) {
            if(st.lastPositions[n - 1 - i] !== st.lastPositions[n - 1 - period - i]) {
                same = false;
                break;
            }
        }
        if(same) { st.loopDetected = true; break; }
    }
}

function getAILoopPenalty(who, move) {
    const st = aiLearningState[who];
    if(!st || !move) return 0;
    const key = `${move.r},${move.c}`;
    const visits = st.positionVisits?.[key] || 0;
    let penalty = visits * 90;
    if((st.lastPositions || []).includes(key)) penalty += 120;
    if(st.loopDetected) penalty += 140;
    return penalty;
}

function recordAIActionHistory(who, key) {
    const st = aiLearningState[who];
    if(!st) return;
    st.recentActions = st.recentActions || [];
    st.recentActions.push(key);
    if(st.recentActions.length > 8) st.recentActions.shift();
    st.actionCount = (st.actionCount || 0) + 1;
}

function getAIOwnActionCount(who) {
    return aiLearningState[who]?.actionCount || 0;
}

function isAIDangerState(who) {
    const state = getMyState(who);
    const myPath = getShortestPath(state.myPos, state.myTargetRow, placedWalls);
    const oppPath = getShortestPath(state.oppPos, state.oppTargetRow, placedWalls);
    const myDist = myPath ? myPath.length - 1 : 999;
    const oppDist = oppPath ? oppPath.length - 1 : 999;
    const opponent = who === 'player' ? 'enemy' : 'player';
    const immediateThreat = getImmediateWinningMoves(opponent, placedWalls).length > 0;
    return immediateThreat || oppDist <= 2 || (oppDist <= 4 && oppDist < myDist - 1);
}

function getAISignature(who) {
    const state = getMyState(who);
    const nearbyWalls = placedWalls.map(w => (w.segments || []).map(seg => `${seg.r1},${seg.c1}-${seg.r2},${seg.c2}`).join('|')).sort().slice(0,12).join(';');
    return `${state.myPos.r},${state.myPos.c}|${state.oppPos.r},${state.oppPos.c}|${state.myWalls.length}|${state.oppWalls.length}|${nearbyWalls}`;
}

function getRouteBranchProfile(who, walls = placedWalls) {
    const state = getMyState(who);
    const branches = getValidMovesWithWalls(state.myPos, walls).map(move => {
        const path = getShortestPath(move, state.myTargetRow, walls);
        return { move: { ...move }, dist: path ? path.length - 1 : 999 };
    }).sort((a,b) => a.dist - b.dist);
    return {
        branches, best: branches[0]?.dist ?? 999, second: branches[1]?.dist ?? 999,
        third: branches[2]?.dist ?? 999, count: branches.filter(b => b.dist < 999).length
    };
}

function getTricksterOpeningAction(who, deadline = null) {
    const st = aiLearningState[who];
    if(!st || getAIOwnActionCount(who) >= 5 || isAIDangerState(who)) return null;
    const state = getMyState(who);
    const moves = getValidMoves(state.myPos);
    const walls = state.myWalls.length > 0 ? getCandidateWallPlacements(who, 220, deadline) : [];
    const mustWall = (st.openingWallCount || 0) < 2 && walls.length > 0;
    if(mustWall || (walls.length > 0 && Math.random() < 0.55)) {
        const pick = walls[Math.floor(Math.random() * walls.length)];
        return { type:'wall', ...pick, strategy:'trickOpening' };
    }
    if(moves.length) {
        const pick = moves[Math.floor(Math.random()*moves.length)];
        return { type:'move', move:pick, strategy:'trickOpening', moveFeatures:getMoveFeatures(who,pick,state,myDistForLearning(who),oppDistForLearning(who)) };
    }
    return null;
}

function getTrapOpeningCandidate(who, deadline = null) {
    const state = getMyState(who);
    if(state.myWalls.length === 0) return null;
    const myPath = getShortestPath(state.myPos, state.myTargetRow, placedWalls);
    const oppPath = getShortestPath(state.oppPos, state.oppTargetRow, placedWalls);
    if(!myPath || !oppPath) return null;
    const myDist = myPath.length - 1, oppDist = oppPath.length - 1;
    let best = null;
    for(const c of getCandidateWallPlacements(who, 360, deadline)) {
        if(aiSearchExpired(deadline)) break;
        const temp = [...placedWalls, c.wallInfo];
        const ap = getShortestPath(state.oppPos, state.oppTargetRow, temp);
        const mp = getShortestPath(state.myPos, state.myTargetRow, temp);
        if(!ap || !mp) continue;
        const afterOpp = ap.length - 1, afterMy = mp.length - 1;
        const delay = afterOpp - oppDist, selfCost = afterMy - myDist;
        const options = getValidMovesWithWalls(state.oppPos, temp).length;
        if(delay > 1 || options < 2 || selfCost > 0) continue;
        const score = options * 18 + (myDist - afterMy) * 35 - Math.max(0,selfCost)*80;
        if(!best || score > best.score) best = { ...c, score, strategy:'trapSet', entry:{...oppPath[Math.min(2,oppPath.length-1)]} };
    }
    return best;
}

function getTrapClosingWall(who, deadline = null) {
    const pending = aiLearningState[who]?.pendingTrap;
    if(!pending) return null;
    const state = getMyState(who);
    const opp = state.oppPos;
    if(!pending.entry || Math.abs(opp.r-pending.entry.r)+Math.abs(opp.c-pending.entry.c)>1) return null;
    const bp = getShortestPath(opp,state.oppTargetRow,placedWalls), bm=getShortestPath(state.myPos,state.myTargetRow,placedWalls);
    if(!bp || !bm) return null;
    const bd=bp.length-1, md=bm.length-1;
    let best=null;
    for(const c of getCandidateWallPlacements(who,500,deadline)) {
        if(aiSearchExpired(deadline)) break;
        const temp=[...placedWalls,c.wallInfo], ap=getShortestPath(opp,state.oppTargetRow,temp), mp=getShortestPath(state.myPos,state.myTargetRow,temp);
        if(!ap || !mp) continue;
        const od=ap.length-1, mdd=mp.length-1, delay=od-bd, self=mdd-md, opts=getValidMovesWithWalls(opp,temp).length;
        let score=delay*140-Math.max(0,self)*120;
        if(self<=0) score+=90;
        if(opts<=2 && delay>0) score+=40;
        if(opts===1 && mdd<=od) score+=90;
        if(opts===1 && mdd>od) score-=180;
        if(!best || score>best.score) best={...c,score,oppDelay:delay,selfCost:self,strategy:'trapClose'};
    }
    return best;
}

function commitAIWall(who, choice, strategy) {
    const state = getMyState(who);
    if(!choice || !choice.wallInfo || choice.wIdx < 0 || choice.wIdx >= state.myWalls.length) {
        aiLower(who);
        return;
    }

    // AIも実際に壁を置く直前に、現在位置から両者のゴールへの経路を
    // 最終確認する。検索中に盤面状態が変わっていた場合もここで遮断する。
    if(!validateWallKeepsBothGoalsReachable(choice.wallInfo.segments, placedWalls)) {
        aiLower(who);
        return;
    }

    // 実行直前の局面を学習用に保存する。
    if(aiLearningState[who]) {
        aiLearningState[who].lastObservedSignature = getAISignature(who);
        aiLearningState[who].lastActionType = 'wall';
        aiLearningState[who].lastActionWall = getAIWallKey(choice.wallInfo);
    }

    recordAIExperienceAction(who, {
        type: 'wall',
        wall: {
            points: choice.wallInfo.points || null,
            segments: choice.wallInfo.segments || [],
            owner: who
        },
        strategy: strategy || null,
        score: Number.isFinite(choice.score) ? choice.score : null,
        defense: !!choice.defense,
        source: 'ai'
    });

    choice.wallInfo.owner = who;
    placedWalls.push(choice.wallInfo);
    state.myWalls.splice(choice.wIdx, 1);

    recordAIActionHistory(who, `wall:${getAIWallKey(choice.wallInfo)}`);
    aiLearningState[who].openingWallCount = (aiLearningState[who].openingWallCount || 0) + 1;
    aiLearningState[who].strategy = strategy || 'block';

    if(strategy === 'trapSet') {
        aiLearningState[who].pendingTrap = { entry: choice.entry ? { ...choice.entry } : null, createdTurn: totalTurnCount };
    } else if(strategy === 'trapClose') {
        aiLearningState[who].pendingTrap = null;
    }

    // 二択を作った場合、相手がどちらを選んだかを次のターンで観測する。
    if(strategy !== 'twoChoice' && aiLearningState[who].pendingTwoChoice?.selected) {
        aiLearningState[who].pendingTwoChoice = null;
    }

    if(strategy === 'twoChoice') {
        const branchMoves = getValidMovesWithWalls(state.oppPos, placedWalls);
        aiLearningState[who].pendingTwoChoice = {
            origin: { ...state.oppPos },
            choices: branchMoves.map(m => ({ ...m })),
            createdTurn: totalTurnCount
        };
    }

    // AI自身の再描画を即時＋次フレームでも行う。
    renderPlacedWalls();
    requestAnimationFrame(() => renderPlacedWalls());

    showTurnTransition(who === 'player' ? 'enemy' : 'player');
}

function evolveAIFromObservation(winner) {
    // EVEの対局を観戦したAIも、勝敗と採用戦略を学習する。
    // 参加していないAIは「観戦学習」として弱めの更新を受け、個性を保ったまま成長する。
    if(gameMode !== 'eve') return;

    const winnerPersonality = winner === 'player' ? p1Personality : p2Personality;
    const loserPersonality = winner === 'player' ? p2Personality : p1Personality;
    const winnerStrategy = aiLearningState[winner].strategy;
    const loserStrategy = aiLearningState[winner === 'player' ? 'enemy' : 'player'].strategy;

    Object.keys(AI_PERSONALITIES).forEach(personality => {
        if(personality === winnerPersonality || personality === loserPersonality) return;

        const profile = aiProfiles[personality] || loadAIProfile(personality);
        aiProfiles[personality] = profile;

        profile.observedGames = (profile.observedGames || 0) + 1;

        // 勝者の戦略を観戦して、ほんの少しだけ評価を上げる。
        // 直接対局したAIより更新幅を小さくして、観戦だけで急激に強くならないようにする。
        if(winnerStrategy && profile.weights[winnerStrategy] !== undefined) {
            profile.weights[winnerStrategy] = Math.min(
                2.20,
                profile.weights[winnerStrategy] + 0.012
            );
        }

        // 敗者の戦略も「相手に通用しなかった例」として少しだけ弱める。
        if(loserStrategy && profile.weights[loserStrategy] !== undefined) {
            profile.weights[loserStrategy] = Math.max(
                0.30,
                profile.weights[loserStrategy] - 0.006
            );
        }

        if(profile.observedGames % 5 === 0) {
            profile.generation = (profile.generation || 1) + 1;
            Object.keys(profile.weights).forEach(key => {
                const base = AI_PERSONALITIES[personality].weights[key];
                profile.weights[key] += (base - profile.weights[key]) * 0.04;
                profile.weights[key] = Math.max(0.30, Math.min(2.20, profile.weights[key]));
            });
        }

        saveAIProfile(personality, profile);
    });
}

function runSelfPlayEvolution() {
    // 全性格のプロフィールを読み込めるようにする。
    // EVEの観戦学習では、現在対戦していないAIも更新対象になる。
    Object.keys(AI_PERSONALITIES).forEach(personality => {
        if(!aiProfiles[personality]) aiProfiles[personality] = loadAIProfile(personality);
    });
    updateEvolutionBadge();
}
