    const enemyPath = getShortestPath(enemyPos, boardSize - 1, testWalls);
    if(!enemyPath || enemyPath.length === 0) return false;

    return true;
}

function isValidWallPlacementWithWalls(segments, baseWalls) {
    if(!segments || segments.length === 0) return false;
    if(!Array.isArray(baseWalls)) return false;

    // ============================================================
    // 壁の幾何学的な設置ルール
    //
    // 盤面のマス境界は 0 ～ boardSize の「格子線」で表す。
    // したがって、壁の端点は 0 ～ boardSize まで許可する。
    // ただし、次の2種類は明確に禁止する。
    //
    //  1. 盤面の外枠から1マス以上はみ出す
    //  2. 外枠と平行に重なる（外枠そのものを壁として使う）
    //
    // 一方、外枠へ「垂直に突き当たる」壁は合法。
    // 例：上端に届く縦壁、右端に届く横壁、下端に届く縦壁、
    //     左端に届く横壁は、経路を完全に潰さない限り設置できる。
    // ============================================================
    for(const seg of segments) {
        const horizontal = seg.r1 === seg.r2 && seg.c1 !== seg.c2;
        const vertical = seg.c1 === seg.c2 && seg.r1 !== seg.r2;
        if(!horizontal && !vertical) return false;

        // 格子線の端点としては 0 ～ boardSize の範囲だけ許可。
        // boardSize を超える／0未満なら、盤面外へはみ出している。
        if(seg.r1 < 0 || seg.r1 > boardSize ||
           seg.r2 < 0 || seg.r2 > boardSize ||
           seg.c1 < 0 || seg.c1 > boardSize ||
           seg.c2 < 0 || seg.c2 > boardSize) return false;

        if(horizontal) {
            // 横壁は上端・下端の外枠と水平に重なるため禁止。
            if(seg.r1 === 0 || seg.r1 === boardSize) return false;

            // 1区間を超えて外へ伸びることは不可。
            if(Math.abs(seg.c2 - seg.c1) !== 1) return false;
        } else {
            // 縦壁は左端・右端の外枠と水平に重なる
            // （＝外枠そのものを壁として使う）ため禁止。
            // 上端・下端には垂直に突き当たってよい。
            if(seg.c1 === 0 || seg.c1 === boardSize) return false;

            // 1区間を超えて外へ伸びることは不可。
            if(Math.abs(seg.r2 - seg.r1) !== 1) return false;
        }
    }

    // 既存壁との重複を禁止。
    for(const w of baseWalls) {
        for(const s1 of (w.segments || [])) {
            for(const s2 of segments) {
                if((s1.r1 === s2.r1 && s1.c1 === s2.c1 && s1.r2 === s2.r2 && s1.c2 === s2.c2) ||
                   (s1.r1 === s2.r2 && s1.c1 === s2.c2 && s1.r2 === s2.r1 && s1.c2 === s2.c1)) return false;
            }
        }
    }

    // ★最重要の根本判定。
    // 壁を「置いた後」ではなく、置く「前」に仮設置して検査する。
    // 現在位置から各自の目標ゴール行まで、上下左右4方向で
    // 1本でも到達経路が残らないなら、この壁は絶対に置けない。
    // 既存壁＋今回の壁＋盤面外枠をすべて含めて判定する。
    if(!validateWallKeepsBothGoalsReachable(segments, baseWalls)) return false;

    return true;
}

function buildWallBlockerSet(walls) {
    const blocked = new Set();
    for(const w of walls || []) {
        for(const seg of (w.segments || [])) {
            const r1 = seg.r1, c1 = seg.c1, r2 = seg.r2, c2 = seg.c2;
            if(r1 === r2) {
                const r = r1;
                const c = Math.min(c1, c2);
                blocked.add(`h:${r},${c}`);
            } else if(c1 === c2) {
                const r = Math.min(r1, r2);
                const c = c1;
                blocked.add(`v:${r},${c}`);
            }
        }
    }
    return blocked;
}

function isBlockedBySet(p1, p2, blocked) {
    // 実際の isWallBlockingWithList と同じ座標規則を使う。
    // 横移動では「移動先側の境界(c=max)」、縦移動では「移動先側の境界(r=max)」を壁として判定する。
    if(p1.r === p2.r) {
        const r = p1.r;
        const c = Math.max(p1.c, p2.c);
        return blocked.has(`v:${r},${c}`);
    }
    const r = Math.max(p1.r, p2.r);
    const c = p1.c;
    return blocked.has(`h:${r},${c}`);
}

// 旧getShortestPathと同じ4方向順を保ったまま、queue.shift()と経路配列の大量コピーを廃止。
function getShortestPath(startPos, targetRow, walls) {
    const blocked = buildWallBlockerSet(walls);
    const total = boardSize * boardSize;
    const visited = new Uint8Array(total);
    const parent = new Int32Array(total);
    parent.fill(-1);
    const queue = new Int32Array(total);
    let head = 0, tail = 0;
    const start = startPos.r * boardSize + startPos.c;
    visited[start] = 1;
    queue[tail++] = start;

    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    let goal = -1;

    while(head < tail) {
        const cur = queue[head++];
        const r = Math.floor(cur / boardSize);
        const c = cur - r * boardSize;
        if(r === targetRow) { goal = cur; break; }

        for(const d of dirs) {
            const nr = r + d[0], nc = c + d[1];
            if(nr < 0 || nr >= boardSize || nc < 0 || nc >= boardSize) continue;
            const next = nr * boardSize + nc;
            if(visited[next]) continue;
            if(isBlockedBySet({r,c}, {r:nr,c:nc}, blocked)) continue;
            visited[next] = 1;
            parent[next] = cur;
            queue[tail++] = next;
        }
    }

    if(goal < 0) return null;
    const reversed = [];
    let cur = goal;
    while(cur >= 0) {
        const r = Math.floor(cur / boardSize);
        const c = cur - r * boardSize;
        reversed.push({r,c});
        if(cur === start) break;
        cur = parent[cur];
    }
    reversed.reverse();
    return reversed;
}

function hasPath(startPos, targetRow, walls) {
    const blocked = buildWallBlockerSet(walls);
    const total = boardSize * boardSize;
    const visited = new Uint8Array(total);
    const queue = new Int32Array(total);
    let head = 0, tail = 0;
    const start = startPos.r * boardSize + startPos.c;
    visited[start] = 1;
    queue[tail++] = start;
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];

    while(head < tail) {
        const cur = queue[head++];
        const r = Math.floor(cur / boardSize);
        const c = cur - r * boardSize;
        if(r === targetRow) return true;
        for(const d of dirs) {
            const nr = r + d[0], nc = c + d[1];
            if(nr < 0 || nr >= boardSize || nc < 0 || nc >= boardSize) continue;
            const next = nr * boardSize + nc;
            if(visited[next]) continue;
            if(isBlockedBySet({r,c}, {r:nr,c:nc}, blocked)) continue;
            visited[next] = 1;
            queue[tail++] = next;
        }
    }
    return false;
}

function isWallBlockingWithList(p1, p2, walls) {
    const minR = Math.min(p1.r, p2.r);
    const maxR = Math.max(p1.r, p2.r);
    const minC = Math.min(p1.c, p2.c);
    const maxC = Math.max(p1.c, p2.c);

    for(let w of walls) {
        for(let seg of w.segments) {
            if (p1.r === p2.r) {
                if (seg.c1 === seg.c2 && seg.c1 === maxC) {
                    if (Math.min(seg.r1, seg.r2) <= p1.r && Math.max(seg.r1, seg.r2) > p1.r) {
                        return true;
                    }
                }
            } else if (p1.c === p2.c) {
                if (seg.r1 === seg.r2 && seg.r1 === maxR) {
                    if (Math.min(seg.c1, seg.c2) <= p1.c && Math.max(seg.c1, seg.c2) > p1.c) {
                        return true;
                    }
                }
            }
        }
    }
    return false;
}

// ============================================================
// 壁の描画・入力で共有する「実盤面の格子線」座標
//
// CSS Grid のセル位置を直接参照する。
// CELL_SIZE の計算値だけを信用すると、スマホの viewport /
// border / padding / gap の差で「表示位置」と「内部座標」がずれる。
// そこで、実際に描画されているセルの右端・下端を基準にする。
//
// logical line 0     = 盤面左/上の外枠
// logical line N     = 盤面右/下の外枠
// logical line 1..N-1 = 隣接セルの間の壁中心
// ============================================================
function getBoardGridMetrics() {
    const board = document.getElementById('board');
    if(!board) return null;

    const cells = board.querySelectorAll('.cell');
    if(!cells || cells.length !== boardSize * boardSize) return null;

    const overlay = document.getElementById('wall-preview-overlay') || document.getElementById('wall-svg-layer');
    if(!overlay) return null;
    const overlayRect = overlay.getBoundingClientRect();
    const rowLines = new Array(boardSize + 1);
    const colLines = new Array(boardSize + 1);

    for(let r = 0; r < boardSize; r++) {
        const cell = board.querySelector(`.cell[data-r=\"${r}\"][data-c=\"0\"]`);
        if(!cell) return null;
        const rect = cell.getBoundingClientRect();
        if(r === 0) rowLines[0] = rect.top - overlayRect.top;
        if(r > 0) {
            const prev = board.querySelector(`.cell[data-r=\"${r-1}\"][data-c=\"0\"]`);
            if(!prev) return null;
            const prevRect = prev.getBoundingClientRect();
            rowLines[r] = (prevRect.bottom + rect.top) / 2 - overlayRect.top;
        }
        if(r === boardSize - 1) rowLines[boardSize] = rect.bottom - overlayRect.top;
    }

    for(let c = 0; c < boardSize; c++) {
        const cell = board.querySelector(`.cell[data-r=\"0\"][data-c=\"${c}\"]`);
        if(!cell) return null;
        const rect = cell.getBoundingClientRect();
        if(c === 0) colLines[0] = rect.left - overlayRect.left;
        if(c > 0) {
            const prev = board.querySelector(`.cell[data-r=\"0\"][data-c=\"${c-1}\"]`);
            if(!prev) return null;
            const prevRect = prev.getBoundingClientRect();
            colLines[c] = (prevRect.right + rect.left) / 2 - overlayRect.left;
        }
        if(c === boardSize - 1) colLines[boardSize] = rect.right - overlayRect.left;
    }

    return { overlayRect, rowLines, colLines };
}

function logicalGridPointToPixel(point, metrics) {
    const m = metrics || getBoardGridMetrics();
    if(!m) {
        return {
            x: point.c * (CELL_SIZE + WALL_THICK) - WALL_THICK / 2,
            y: point.r * (CELL_SIZE + WALL_THICK) - WALL_THICK / 2
        };
    }
    return {
        x: m.colLines[Math.max(0, Math.min(boardSize, point.c))],
        y: m.rowLines[Math.max(0, Math.min(boardSize, point.r))]
    };
}

function buildSVGPathFromPoints(points) {
    const metrics = getBoardGridMetrics();
    let pathD = '';
    points.forEach((p, idx) => {
        const px = logicalGridPointToPixel(p, metrics);
        pathD += (idx === 0 ? 'M' : 'L') + `${px.x},${px.y} `;
    });
    return pathD;
}

function drawPreview(wallPos) {
    clearPreview();
    const previewOverlay = document.getElementById('wall-preview-overlay');
    if (!previewOverlay) return;

    const pathD = buildSVGPathFromPoints(wallPos.points);
    const strokeColor = wallPos.isValid ? '#2ecc71' : '#e74c3c';

    const pathElem = document.createElementNS("http://www.w3.org/2000/svg", "path");
    pathElem.setAttribute("d", pathD);
    pathElem.setAttribute("stroke", strokeColor);
    pathElem.setAttribute("stroke-width", WALL_THICK);
    pathElem.setAttribute("fill", "none");
    pathElem.setAttribute("stroke-linecap", "round");
    pathElem.setAttribute("stroke-linejoin", "round");
    pathElem.setAttribute("opacity", "0.85");

    previewOverlay.appendChild(pathElem);
}

function handleBoardClickForWall(e) {
    if(gameEnded || isMobilePlacementMode()) return;

    const isHumanTurn = (currentTurn === 'player' && p1Difficulty === 'human') || (currentTurn === 'enemy' && p2Difficulty === 'human');
    if(!selectedWallTypeKey || !isHumanTurn) return;

    const metrics = getBoardGridMetrics();
    if(!metrics) return;
    const x = e.clientX - metrics.overlayRect.left;
    const y = e.clientY - metrics.overlayRect.top;

    const wallData = getSelectedWallData(currentTurn);
    if(!wallData) return;

    const wallPos = calculateWallPos(x, y, wallData, rotationAngle);

    // 設置不可能な位置の場合は設置をガード。
    // さらに、実際にpushする直前にも「現在位置→各自ゴール」の
    // 経路が残ることを再確認する。
    if(wallPos.isValid && validateWallKeepsBothGoalsReachable(wallPos.segments, placedWalls)) {
        recordAIExperienceAction(currentTurn, {
            type: 'wall',
            wall: { points: wallPos.points, segments: wallPos.segments, owner: currentTurn },
            source: 'human-wall-desktop'
        });

        placedWalls.push({ points: wallPos.points, segments: wallPos.segments, owner: currentTurn });
        renderPlacedWalls();

        const wallList = currentTurn === 'player' ? playerWalls : enemyWalls;
        const idx = wallList.findIndex(w => `${w.type}_${w.len}` === selectedWallTypeKey);
        if(idx !== -1) wallList.splice(idx, 1);

        selectedWallTypeKey = null;
        clearPreview();
        showTurnTransition(currentTurn === 'player' ? 'enemy' : 'player', '時間切れ・ターン終了');
    }
}

function renderPlacedWalls() {
    let svgLayer = document.getElementById('wall-svg-layer');
    const board = document.getElementById('board');
    if(!board) return;

    // 盤面再生成などでSVGが消えても、その場で復旧する。
    if(!svgLayer) {
        svgLayer = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svgLayer.id = "wall-svg-layer";
        svgLayer.classList.add("wall-svg-layer");
        board.insertBefore(svgLayer, board.firstChild);
    }

    const totalPx = boardSize * CELL_SIZE + (boardSize - 1) * WALL_THICK;
    svgLayer.setAttribute("viewBox", `0 0 ${totalPx} ${totalPx}`);
    svgLayer.setAttribute("width", totalPx);
    svgLayer.setAttribute("height", totalPx);
    svgLayer.style.width = totalPx + "px";
    svgLayer.style.height = totalPx + "px";
    svgLayer.style.display = "block";
    svgLayer.style.visibility = "visible";
    svgLayer.style.opacity = "1";
    svgLayer.style.zIndex = "1000";

    svgLayer.innerHTML = '';

    const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    defs.innerHTML = `
        <linearGradient id="playerWallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffb347" />
            <stop offset="45%" stop-color="#ff7f32" />
            <stop offset="100%" stop-color="#d94b3d" />
        </linearGradient>
        <linearGradient id="enemyWallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#777777" />
            <stop offset="50%" stop-color="#333333" />
            <stop offset="100%" stop-color="#090909" />
        </linearGradient>
        <filter id="wallShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.9"/>
        </filter>
    `;
    svgLayer.appendChild(defs);

    placedWalls.forEach((w, index) => {
        if(!w || !w.points || w.points.length < 2) return;

        const pathD = buildSVGPathFromPoints(w.points);
        const isPlayer1 = (w.owner === 'player');

        // 下地 → 本体 → ハイライトの3層にして、細くなったり背景に埋もれたりしないようにする。
        const borderElem = document.createElementNS("http://www.w3.org/2000/svg", "path");
        borderElem.setAttribute("d", pathD);
        borderElem.setAttribute("stroke", isPlayer1 ? "#4b1a00" : "#000000");
        borderElem.setAttribute("stroke-width", WALL_THICK + 8);
        borderElem.setAttribute("fill", "none");
        borderElem.setAttribute("stroke-linecap", "round");
        borderElem.setAttribute("stroke-linejoin", "round");
        borderElem.setAttribute("vector-effect", "non-scaling-stroke");
        borderElem.setAttribute("filter", "url(#wallShadow)");

        const pathElem = document.createElementNS("http://www.w3.org/2000/svg", "path");
        pathElem.setAttribute("d", pathD);
        pathElem.setAttribute("stroke", isPlayer1 ? "url(#playerWallGradient)" : "url(#enemyWallGradient)");
        pathElem.setAttribute("stroke-width", WALL_THICK);
        pathElem.setAttribute("fill", "none");
        pathElem.setAttribute("stroke-linecap", "round");
        pathElem.setAttribute("stroke-linejoin", "round");
        pathElem.setAttribute("vector-effect", "non-scaling-stroke");

        const highlightElem = document.createElementNS("http://www.w3.org/2000/svg", "path");
        highlightElem.setAttribute("d", pathD);
        highlightElem.setAttribute("stroke", isPlayer1 ? "#ffd28a" : "#aaaaaa");
        highlightElem.setAttribute("stroke-width", "2");
        highlightElem.setAttribute("fill", "none");
        highlightElem.setAttribute("stroke-linecap", "round");
        highlightElem.setAttribute("stroke-linejoin", "round");
        highlightElem.setAttribute("opacity", "0.9");
        highlightElem.setAttribute("vector-effect", "non-scaling-stroke");

        borderElem.dataset.wallIndex = index;
        pathElem.dataset.wallIndex = index;
        highlightElem.dataset.wallIndex = index;

        svgLayer.appendChild(borderElem);
        svgLayer.appendChild(pathElem);
        svgLayer.appendChild(highlightElem);
    });
}
function runAI(who, diff) {
    if(gameEnded || currentTurn !== who) return;

    beginAIThinkingMeasure(who, diff);

    const mode = getSelectedAIMode(who);
    const personality = getSelectedPersonality(who);

    if(mode === 'dynamic') {
        aiDynamic(who, diff);
        endAIThinkingMeasure();
        return;
    }

    // ノーマルでも性格は反映する。ただし探索量を抑え、ダイナミックとの差を明確にする。
    if(personality !== 'universal' || diff === 'upper' || diff === 'special') {
        aiNormalPersonality(who, diff);
        endAIThinkingMeasure();
        return;
    }

    if(diff === 'lower') {
        aiLower(who);
    } else if(diff === 'middle') {
        aiMiddle(who);
    } else if(diff === 'upper') {
        aiUpper(who);
    } else {
        aiSpecial(who);
    }
    endAIThinkingMeasure();
}

function getMyState(who) {
    return {
        myPos: (who === 'player') ? playerPos : enemyPos,
        myTargetRow: (who === 'player') ? 0 : boardSize - 1,
        oppPos: (who === 'player') ? enemyPos : playerPos,
        oppTargetRow: (who === 'player') ? boardSize - 1 : 0,
        myWalls: (who === 'player') ? playerWalls : enemyWalls,
        oppWalls: (who === 'player') ? enemyWalls : playerWalls
    };
}

function aiLower(who) {
    const deadline = getAIThinkDeadline(who);
    // 難易度が下級でも「負けそうなのに壁を残して直進」は許さない。
    // 防御だけは全AI共通の絶対安全規則として先に判定する。
    const mandatory = findMandatoryDefenseWall(who, deadline);
    if(mandatory) {
        mandatory.strategy = 'emergency';
        commitAIWall(who, mandatory, 'emergency');
        return;
    }

    const state = getMyState(who);

    // 下級でも「相手のゴールを妨害できる壁」を見つけたら、直進より壁を優先する。
    if(state.myWalls.length > 0 && !aiSearchExpired(deadline)) {
        const wall = findBestWallAction(who, {
            minDelay: 0,
            maxSelfCost: 4,
            mode: 'block',
            searchDepth: 1,
            personality: getSelectedPersonality(who),
            candidateLimit: 800,
            baseMyDist: myDistForLearning(who),
            baseOppDist: oppDistForLearning(who),
            proactive: true,
            deadline
        });
        if(wall && wall.oppDelay > 0) {
            commitAIWall(who, wall, 'block');
            return;
        }
    }

    const moves = getValidMoves(state.myPos);

    if(moves.length > 0) {
        // 完全なランダムではなく、少しだけゴール方向を優先する。
        const scored = moves.map(m => ({
            move: m,
            score: (who === 'player' ? -m.r : m.r) + Math.random() * 3
        }));
        scored.sort((a,b) => b.score - a.score);
        recordAIMoveLearning(
            who,
            getMoveFeatures(who, scored[0].move, state, myDistForLearning(who), oppDistForLearning(who)),
            'race'
        );
        executeMove(who, scored[0].move);
    } else {
        aiLearningState[who].strategy = 'defense';
        showTurnTransition(who === 'player' ? 'enemy' : 'player');
    }
}

function aiMiddle(who) {
    // 中級も例外ではない。相手が次の一手で勝てるなら、
    // 通常の中級ロジックより先に必ず壁で妨害する。
    const mandatory = findMandatoryDefenseWall(who);
    if(mandatory) {
        mandatory.strategy = 'emergency';
        commitAIWall(who, mandatory, 'emergency');
        return;
    }

    const state = getMyState(who);
    const path = getShortestPath(state.myPos, state.myTargetRow, placedWalls);

    // 中級は「最短路を選ぶ」だけでなく、直近の妨害に対して壁を1回だけ検討する。
    const wallChoice = findBestWallAction(who, {
        minDelay: 2,
        maxSelfCost: 1,
        mode: 'block',
        searchDepth: 1,
        personality: 'universal'
    });

    if(wallChoice && wallChoice.score >= 22) {
        commitAIWall(who, wallChoice, 'block');
        return;
    }

    if(path && path.length > 1) {
        aiLearningState[who].strategy = 'race';
        executeMove(who, path[1]);
    } else {
        aiLower(who);
    }
}

function aiUpper(who) {
    // ノーマル上級は万能型を基準に安定した一手を選ぶ。
    const personality = 'universal';
    const choice = chooseAIAction(who, {
        level: 'upper',
        personality,
        candidateLimit: 180,
        lookAhead: 1
    });

    if(choice.type === 'wall') {
        commitAIWall(who, choice, choice.strategy);
        return;
    }

    if(choice.type === 'move') {
        recordAIMoveLearning(who, choice.moveFeatures || getMoveFeatures(who, choice.move, getMyState(who), myDistForLearning(who), oppDistForLearning(who)), choice.strategy || 'race');
        executeMove(who, choice.move);
        return;
    }

    aiLower(who);
}

function aiSpecial(who) {
    const personality = (who === 'player') ? p1Personality : p2Personality;

    // 特級は「移動」「通常妨害」「防御」「奇襲」「誘導罠」を同時に候補として評価する。
    // ただし毎回同じ作戦を選ばず、盤面と過去の勝敗から重みを更新する。
    const choice = chooseAIAction(who, {
        level: 'special',
        personality,
        candidateLimit: 320,
        lookAhead: 2
    });

    if(choice.type === 'wall') {
        commitAIWall(who, choice, choice.strategy);
        return;
    }

    if(choice.type === 'move') {
        recordAIMoveLearning(who, choice.moveFeatures || getMoveFeatures(who, choice.move, getMyState(who), myDistForLearning(who), oppDistForLearning(who)), choice.strategy || 'race');
        executeMove(who, choice.move);
        return;
    }

    aiLower(who);
}

// ============================================================
// AI計算軽量化用の内部設定
// 性格・評価式・勝ち方は変更せず、同じ探索結果をより少ない計算で求める。
// ============================================================
const AI_PERF = {
    normalCandidateLimit: { lower: 55, middle: 55, upper: 90, special: 120 },
    dynamicCandidateLimit: { lower: 190, middle: 190, upper: 300, special: 420 },
    normalLookAhead: { lower: 0, middle: 0, upper: 0, special: 1 },
    dynamicLookAhead: { lower: 1, middle: 1, upper: 2, special: 3 }
};

// ============================================================
// AI思考時間制限
// 通常は約5秒、危険局面では最大10秒まで考える。
// AIは最大時間まで必ず待つのではなく、良い手が見つかれば即終了する。
// ============================================================
const AI_THINK_TIME_LIMIT_MS = 5000;
const AI_DANGER_THINK_TIME_LIMIT_MS = 10000;

function getAIThinkDeadline(who) {
    const state = getMyState(who);
    const myPath = getShortestPath(state.myPos, state.myTargetRow, placedWalls);
    const oppPath = getShortestPath(state.oppPos, state.oppTargetRow, placedWalls);
    const myDist = myPath ? myPath.length - 1 : 999;
    const oppDist = oppPath ? oppPath.length - 1 : 999;

    const danger = oppDist <= 2 || (oppDist <= 3 && myDist >= oppDist + 2) || getImmediateWinningMoves(who === 'player' ? 'enemy' : 'player', placedWalls).length > 0;
    const limit = danger
        ? Math.max(AI_THINK_TIME_LIMIT_MS, AI_DANGER_THINK_TIME_LIMIT_MS)
        : AI_THINK_TIME_LIMIT_MS;

    return performance.now() + limit;
}

function aiSearchExpired(deadline) {
    return deadline !== null && performance.now() >= deadline;
}

let aiThinkingStartTime = 0;
let aiThinkingWho = null;
let aiThinkingDiff = null;

function beginAIThinkingMeasure(who, diff) {
    aiThinkingStartTime = performance.now();
    aiThinkingWho = who;
    aiThinkingDiff = diff;
}

function endAIThinkingMeasure() {
    if(!aiThinkingStartTime) return;
    const elapsed = performance.now() - aiThinkingStartTime;
    console.log(`AI思考時間: ${elapsed.toFixed(1)}ms / ${aiThinkingWho} / ${aiThinkingDiff} / 上限=${AI_THINK_TIME_LIMIT_MS}ms（危険局面は最大${AI_DANGER_THINK_TIME_LIMIT_MS}ms）`);
    aiThinkingStartTime = 0;
    aiThinkingWho = null;
    aiThinkingDiff = null;
}

function aiNormalPersonality(who, diff) {
    const personality = getSelectedPersonality(who);
    const choice = chooseAIAction(who, {
        level: 'normal',
        personality,
        candidateLimit: AI_PERF.normalCandidateLimit[diff] || 55,
        lookAhead: AI_PERF.normalLookAhead[diff] || 0
    });

    if(choice.type === 'wall') {
        commitAIWall(who, choice, choice.strategy);
        return;
    }

    if(choice.type === 'move') {
        recordAIMoveLearning(who, choice.moveFeatures || getMoveFeatures(who, choice.move, getMyState(who), myDistForLearning(who), oppDistForLearning(who)), choice.strategy || 'race');
        executeMove(who, choice.move);
        return;
    }

    aiLower(who);
}

function aiDynamic(who, diff) {
    const personality = getSelectedPersonality(who);
    const isSpecial = diff === 'special';
    const choice = chooseAIAction(who, {
        level: 'dynamic',
        personality,
        candidateLimit: AI_PERF.dynamicCandidateLimit[diff] || 190,
        lookAhead: AI_PERF.dynamicLookAhead[diff] || 1
    });

    if(choice.type === 'wall') {
        commitAIWall(who, choice, choice.strategy);
        return;
    }

    if(choice.type === 'move') {
        recordAIMoveLearning(who, choice.moveFeatures || getMoveFeatures(who, choice.move, getMyState(who), myDistForLearning(who), oppDistForLearning(who)), choice.strategy || 'race');
        executeMove(who, choice.move);
        return;
    }

    aiLower(who);
}

function myDistForLearning(who) {
    const s = getMyState(who);
    const p = getShortestPath(s.myPos, s.myTargetRow, placedWalls);
    return p ? p.length - 1 : 999;
}

function oppDistForLearning(who) {
    const s = getMyState(who);
    const p = getShortestPath(s.oppPos, s.oppTargetRow, placedWalls);
    return p ? p.length - 1 : 999;
}

function getMoveFeatures(who, move, state, myDist, oppDist) {
    const newPath = getShortestPath(move, state.myTargetRow, placedWalls);
    const newDist = newPath ? newPath.length - 1 : 999;
    const progress = Math.max(0, myDist - newDist);
    const beforeOptions = getValidMovesWithWalls(state.myPos, placedWalls).length;
    const afterOptions = getValidMovesWithWalls(move, placedWalls).length;
    const opponentOptions = getValidMovesWithWalls(state.oppPos, placedWalls).length;
    const distanceToOpp = Math.abs(move.r - state.oppPos.r) + Math.abs(move.c - state.oppPos.c);
    return {
        progress: Math.min(2, progress),
        safe: distanceToOpp === 1 ? 0.25 : 1,
        flexible: Math.min(2, afterOptions / 2),
        lure: Math.max(0, Math.min(2, opponentOptions / 2)),
        ambush: distanceToOpp <= 2 ? 1 : 0,
        wait: progress === 0 ? 1 : 0,
        comeback: myDist > oppDist && progress > 0 ? 1 : 0,
        finish: move.r === state.myTargetRow ? 2 : 0
    };
}

function recordAIMoveLearning(who, features, strategy) {
    const state = aiLearningState[who];
    state.moveFeatures = features;
    state.strategy = strategy || 'race';
}


// ============================================================
// v7 戦略エンジン
// 「自分の利益」だけでなく「相手の利益をどれだけ潰せるか」
// 「残り壁で相手の期待値をどこまで上下させられるか」を同時に評価する。
// 100手先は全探索ではなく、合法手だけを対象にしたビーム型の長期探索で近似する。
// 重要なのは深さを表示上だけ増やすことではなく、各深さで盤面・壁・両者の距離を再計算すること。
// ============================================================

const AI_LONG_HORIZON = 5;
const AI_LONG_BEAM = 3;
const AI_LONG_WALL_BRANCH = 2;

function cloneStrategicState(s) {
    return {
        p1Pos: { ...s.p1Pos },
        p2Pos: { ...s.p2Pos },
        p1Walls: s.p1Walls.map(w => ({ ...w })),
        p2Walls: s.p2Walls.map(w => ({ ...w })),
        placedWalls: s.placedWalls.map(w => ({
            ...w,
            points: w.points ? w.points.map(p => ({ ...p })) : [],
            segments: w.segments ? w.segments.map(seg => ({ ...seg })) : []
        })),
        turn: s.turn
    };
}

function strategicGoalRow(turn) {
    return turn === 'player' ? 0 : boardSize - 1;
}

function strategicPosOf(s, who) {
    return who === 'player' ? s.p1Pos : s.p2Pos;
}

function strategicWallsOf(s, who) {
    return who === 'player' ? s.p1Walls : s.p2Walls;
}

function strategicOpponent(who) {
    return who === 'player' ? 'enemy' : 'player';
}

function strategicHasPath(pos, targetRow, walls) {
    return hasPath(pos, targetRow, walls);
}

function strategicWallEquals(a, b) {
    if(!a || !b || !a.segments || !b.segments || a.segments.length !== b.segments.length) return false;
    return a.segments.every(sa => b.segments.some(sb =>
        sa.r1 === sb.r1 && sa.c1 === sb.c1 && sa.r2 === sb.r2 && sa.c2 === sb.c2
    ));
}

function strategicIsValidWall(info, s) {
    if(!info || !info.segments || info.segments.length === 0) return false;

    for(const seg of info.segments) {
        if(seg.r1 < 0 || seg.r1 > boardSize || seg.r2 < 0 || seg.r2 > boardSize ||
           seg.c1 < 0 || seg.c1 > boardSize || seg.c2 < 0 || seg.c2 > boardSize) return false;

        if(seg.r1 === seg.r2 && (seg.r1 === 0 || seg.r1 === boardSize)) return false;
        if(seg.c1 === seg.c2 && (seg.c1 === 0 || seg.c1 === boardSize)) return false;
    }

    for(const w of s.placedWalls) {
        for(const a of w.segments || []) {
            for(const b of info.segments) {
                if((a.r1 === b.r1 && a.c1 === b.c1 && a.r2 === b.r2 && a.c2 === b.c2) ||
                   (a.r1 === b.r2 && a.c1 === b.c2 && a.r2 === b.r1 && a.c2 === b.c1)) {
                    return false;
                }
            }
        }
    }

    const nextWalls = [...s.placedWalls, { segments: info.segments }];
    if(!strategicHasPath(s.p1Pos, 0, nextWalls)) return false;
    if(!strategicHasPath(s.p2Pos, boardSize - 1, nextWalls)) return false;
    return true;
}

function strategicWallAnchors(s, who) {
    const me = strategicPosOf(s, who);
    const opp = strategicPosOf(s, strategicOpponent(who));
    const myTarget = strategicGoalRow(who);
    const oppTarget = strategicGoalRow(strategicOpponent(who));
    const myPath = getShortestPath(me, myTarget, s.placedWalls) || [];
    const oppPath = getShortestPath(opp, oppTarget, s.placedWalls) || [];

    return [
        ...oppPath.slice(0, 6),
        ...oppPath.slice(-4),
        ...myPath.slice(0, 4),
        me,
        opp
    ];
}

function getStrategicWallCandidates(s, who, limit = AI_LONG_WALL_BRANCH) {
    const inventory = strategicWallsOf(s, who);
    if(inventory.length === 0) return [];

    const anchors = strategicWallAnchors(s, who);
    const positions = [];
    const seen = new Set();

    anchors.forEach(a => {
        for(let dr = -2; dr <= 2; dr++) {
            for(let dc = -2; dc <= 2; dc++) {
                const r = a.r + dr;
                const c = a.c + dc;
                if(r < 0 || r > boardSize || c < 0 || c > boardSize) continue;
                const key = `${r},${c}`;
                if(!seen.has(key)) {
                    seen.add(key);
                    positions.push({r,c});
                }
            }
        }
    });

    // 全盤走査は長期探索では重すぎるため、中央・端・両者の進路周辺だけを追加する。
    const globalSamples = [
        {r: Math.floor(boardSize / 2), c: Math.floor(boardSize / 2)},
        {r: 1, c: Math.floor(boardSize / 2)},
        {r: boardSize - 1, c: Math.floor(boardSize / 2)},
        {r: Math.floor(boardSize / 2), c: 1},
        {r: Math.floor(boardSize / 2), c: boardSize - 1}
    ];
    globalSamples.forEach(p => {
        if(p.r < 0 || p.r > boardSize || p.c < 0 || p.c > boardSize) return;
        const key = `${p.r},${p.c}`;
        if(!seen.has(key)) {
            seen.add(key);
            positions.push(p);
        }
    });

    const scored = [];
    const rotations = [0,90,180,270];

    for(let wIdx = 0; wIdx < inventory.length; wIdx++) {
        const wallData = inventory[wIdx];
        for(const pos of positions) {
            for(const rot of rotations) {
                const info = getWallInfo(pos.r, pos.c, wallData, rot);
                if(!strategicIsValidWall(info, s)) continue;

                const nextWalls = [...s.placedWalls, { segments: info.segments }];
                const opp = strategicOpponent(who);
                const beforeOpp = getShortestPath(strategicPosOf(s, opp), strategicGoalRow(opp), s.placedWalls);
                const afterOpp = getShortestPath(strategicPosOf(s, opp), strategicGoalRow(opp), nextWalls);
                const beforeMe = getShortestPath(strategicPosOf(s, who), strategicGoalRow(who), s.placedWalls);
                const afterMe = getShortestPath(strategicPosOf(s, who), strategicGoalRow(who), nextWalls);

                const oppGain = afterOpp ? (afterOpp.length - 1) - (beforeOpp ? beforeOpp.length - 1 : 999) : 999;
                const selfCost = afterMe ? (afterMe.length - 1) - (beforeMe ? beforeMe.length - 1 : 999) : 999;

                scored.push({
                    wallInfo: info,
                    wIdx,
                    oppGain,
                    selfCost,
                    score: oppGain * 18 - Math.max(0, selfCost) * 14
                });
            }
        }
    }

    scored.sort((a,b) => b.score - a.score);

    // 同じ形・位置を重複させない。
    const result = [];
    const used = new Set();
    for(const item of scored) {
        const key = item.wallInfo.segments.map(seg =>
            `${seg.r1},${seg.c1},${seg.r2},${seg.c2}`
        ).sort().join('|');
        if(used.has(key)) continue;
        used.add(key);
        result.push(item);
        if(result.length >= limit) break;
    }
    return result;
}

function getStrategicActions(s, who, wallLimit = AI_LONG_WALL_BRANCH) {
    const pos = strategicPosOf(s, who);
    const moves = getValidMovesWithWalls(pos, s.placedWalls).map(m => ({
        type: 'move',
        move: { ...m }
    }));

    const walls = getStrategicWallCandidates(s, who, wallLimit).map(w => ({
        type: 'wall',
        wallInfo: { ...w.wallInfo },
        wIdx: w.wIdx
    }));

    return [...moves, ...walls];
}

function applyStrategicAction(s, who, action) {
    const next = cloneStrategicState(s);

    if(action.type === 'move') {
        const target = action.move;
        if(who === 'player') next.p1Pos = { ...target };
        else next.p2Pos = { ...target };
        next.turn = strategicOpponent(who);
        return next;
    }

    if(action.type === 'wall') {
        const wall = {
            points: action.wallInfo.points ? action.wallInfo.points.map(p => ({...p})) : [],
            segments: action.wallInfo.segments ? action.wallInfo.segments.map(seg => ({...seg})) : [],
            owner: who
        };
        next.placedWalls.push(wall);

        const inventory = strategicWallsOf(next, who);
        if(action.wIdx >= 0 && action.wIdx < inventory.length) inventory.splice(action.wIdx, 1);

        next.turn = strategicOpponent(who);
        return next;
    }

    return next;
}

function strategicStateTerminal(s) {
    if(s.p1Pos.r === 0) return 'player';
    if(s.p2Pos.r === boardSize - 1) return 'enemy';
    return null;
}

function evaluateStrategicPosition(s, perspective) {
    const me = strategicPosOf(s, perspective);
    const oppWho = strategicOpponent(perspective);
    const opp = strategicPosOf(s, oppWho);
    const myTarget = strategicGoalRow(perspective);
    const oppTarget = strategicGoalRow(oppWho);

    const myPath = getShortestPath(me, myTarget, s.placedWalls);
    const oppPath = getShortestPath(opp, oppTarget, s.placedWalls);

    if(!myPath) return -100000;
    if(!oppPath) return 100000;

    const myDist = myPath.length - 1;
    const oppDist = oppPath.length - 1;

    const myMoves = getValidMovesWithWalls(me, s.placedWalls);
    const oppMoves = getValidMovesWithWalls(opp, s.placedWalls);
    const myWalls = strategicWallsOf(s, perspective).length;
    const oppWalls = strategicWallsOf(s, oppWho).length;

    // 自分の利益。
    let value = (oppDist - myDist) * 42;
    value += Math.max(0, myWalls - oppWalls) * 5;
    value += Math.min(4, myMoves.length) * 3;

    // 相手の利益を最小化する項。相手の選択肢が多いほど不利。
    value -= oppMoves.length * 8;
    value -= Math.max(0, oppDist - myDist) * 16;

    // 壁の残量を「将来の干渉可能回数」として評価。
    // 0枚は盤面への干渉能力を失うため強いペナルティ。
    if(myWalls === 0) value -= 85;
    else if(myWalls === 1) value -= 28;
    else if(myWalls === 2) value -= 9;

    if(oppWalls === 0) value += 22;

    // 「相手がこちらにとって意味のない場所へ進む」状態を高く評価。
    const opponentRelevant = oppPath.slice(0, Math.min(6, oppPath.length))
        .filter(p => Math.abs(p.c - me.c) <= 2).length;
    value += (6 - opponentRelevant) * 3;

    // ゴール直前は勝敗を最優先。
    if(myDist <= 1) value += 500;
    if(oppDist <= 1) value -= 700;

    return value;
}

function evaluateOpponentBenefitRange(s, perspective) {
    const oppWho = strategicOpponent(perspective);
    const actions = getStrategicActions(s, oppWho, 4);
    if(actions.length === 0) {
        return { lower: 0, upper: 0, mean: 0 };
    }

    const values = actions.map(action => {
        const ns = applyStrategicAction(s, oppWho, action);
        return -evaluateStrategicPosition(ns, perspective);
    });

    const lower = Math.min(...values);
    const upper = Math.max(...values);
    const mean = values.reduce((a,b) => a + b, 0) / values.length;
    return { lower, upper, mean };
}

function evaluateLongHorizon100(rootState, perspective, deadline = null) {
    let beam = [{
        state: cloneStrategicState(rootState),
        score: evaluateStrategicPosition(rootState, perspective),
        line: []
    }];

    let bestTerminal = null;
    let horizonBest = beam[0];

    for(let depth = 1; depth <= AI_LONG_HORIZON; depth++) {
        if(aiSearchExpired(deadline)) break;

        const expanded = [];

        for(const node of beam) {
            if(aiSearchExpired(deadline)) break;

            const who = node.state.turn;
            const actions = getStrategicActions(node.state, who, AI_LONG_WALL_BRANCH);

            // その時点の合法手を全てではなく、少数の代表候補に絞る。
            // 壁探索は4手ごとに入れ、100手先まで読める深さを確保しつつUI停止を避ける。
            const local = [];
            const strategicActions = (depth % 4 === 0 || depth <= 2)
                ? actions
                : actions.filter(a => a.type === 'move');

            for(const action of strategicActions) {
                const ns = applyStrategicAction(node.state, who, action);
                const terminal = strategicStateTerminal(ns);
                let value = evaluateStrategicPosition(ns, perspective);

                // 相手の期待値上限・下限は節目の深さで再計算する。
                if(depth <= 3 || depth % 5 === 0) {
                    const range = evaluateOpponentBenefitRange(ns, perspective);
                    if(who === perspective) {
                        value += (range.lower + range.mean) * 0.18;
                        value += (range.upper - range.lower) * 0.05;
                    } else {
                        value -= range.upper * 0.28;
                        value -= Math.max(0, range.upper - range.mean) * 0.10;
                    }
                }

                // 先の手ほど少しだけ減衰。ただし100手目まで評価対象にする。
                const discount = Math.pow(0.992, depth);
                value *= discount;

                if(terminal === perspective) value += 120000 / depth;
                if(terminal === strategicOpponent(perspective)) value -= 140000 / depth;

                local.push({
                    state: ns,
                    score: value,
                    line: [...node.line, action]
                });
            }

            local.sort((a,b) => b.score - a.score);
            expanded.push(...local.slice(0, AI_LONG_BEAM));
        }

        if(expanded.length === 0) break;

        // ビーム全体を再選別。
        expanded.sort((a,b) => b.score - a.score);
        beam = expanded.slice(0, AI_LONG_BEAM);

        if(beam[0].score > horizonBest.score) horizonBest = beam[0];

        const terminalNode = beam.find(n => strategicStateTerminal(n.state));
        if(terminalNode) {
            if(!bestTerminal || terminalNode.score > bestTerminal.score) bestTerminal = terminalNode;
        }
    }

    return {
        score: bestTerminal ? bestTerminal.score : horizonBest.score,
        line: (bestTerminal || horizonBest).line,
        depth: AI_LONG_HORIZON
    };
}

function evaluateActionWithStrategicRange(who, action, baseState, baseScore) {
    const ns = applyStrategicAction(baseState, who, action);
    const immediate = evaluateStrategicPosition(ns, who);
    const range = evaluateOpponentBenefitRange(ns, who);

    // 自分の最大利益 ? 相手の最大利益、を基本軸にする。
    let score = immediate * 0.55;
    score -= range.upper * 0.85;
    score += range.lower * 0.30;
    score += range.mean * 0.25;

    // 「相手の期待値の幅」を狭める/広げること自体を戦略として扱う。
    const uncertainty = range.upper - range.lower;
    if(who === 'player' || who === 'enemy') {
        score += Math.max(0, 24 - uncertainty) * 0.35;
    }

    const myWalls = strategicWallsOf(baseState, who).length;
    const nextWalls = strategicWallsOf(ns, who).length;
    if(nextWalls === 0 && myWalls > 0) score -= 80;
    if(nextWalls === 1 && myWalls > 1) score -= 20;

    // 盤面に干渉できない/干渉しても意味がないルートを相手に与える。
    const opp = strategicOpponent(who);
    const oppPath = getShortestPath(strategicPosOf(ns, opp), strategicGoalRow(opp), ns.placedWalls);
    if(oppPath) {
        const relevant = oppPath.slice(0, 7).filter(p => {
            const myPos = strategicPosOf(ns, who);
            return Math.abs(p.r - myPos.r) + Math.abs(p.c - myPos.c) <= 3;
        }).length;
        score += (7 - relevant) * 4;
    }

    return score + baseScore * 0.03;
}

function getImmediateWinningMoves(who, walls = placedWalls) {
    const state = getMyState(who);
    return getValidMovesWithWalls(state.myPos, walls)
        .filter(move => move.r === state.myTargetRow);
}

function getMandatoryDefenseThreat(who) {
    const state = getMyState(who);
    if(state.myWalls.length === 0) return null;

    const myPath = getShortestPath(state.myPos, state.myTargetRow, placedWalls);
    const oppPath = getShortestPath(state.oppPos, state.oppTargetRow, placedWalls);
    if(!myPath || !oppPath) return null;

    const myDist = myPath.length - 1;
    const oppDist = oppPath.length - 1;
    const myWinningMoves = getImmediateWinningMoves(who, placedWalls);
    const opponentWho = who === 'player' ? 'enemy' : 'player';
    const oppWinningMoves = getImmediateWinningMoves(opponentWho, placedWalls);

    // 自分がこのターンに勝てるなら、勝利を最優先する。
    if(myWinningMoves.length > 0) {
        return { myDist, oppDist, myWinningMoves, oppWinningMoves, selfCanWin: true };
    }

    // 相手に「次の自分のターンでゴールできる手」が1つでもあるなら絶対防御。
    const immediateLoss = oppWinningMoves.length > 0 || oppDist <= 1;
    const nearLoss = oppDist <= 2 && myDist > oppDist;
    const severeLoss = oppDist <= 3 && myDist >= oppDist + 2;

    if(immediateLoss || nearLoss || severeLoss) {
        return { myDist, oppDist, immediateLoss, nearLoss, severeLoss,
            myWinningMoves, oppWinningMoves, selfCanWin: false };
    }
    return null;
}

function findMandatoryDefenseWall(who, deadline = null) {
    const threat = getMandatoryDefenseThreat(who);
    if(!threat || threat.selfCanWin) return null;

    const actualDeadline = deadline ?? getAIThinkDeadline(who);
    const state = getMyState(who);
    if(state.myWalls.length === 0) return null;

    const opponentWho = who === 'player' ? 'enemy' : 'player';
    let bestSafe = null;
    let bestFallback = null;

    // 緊急時はランダム候補に依存しない。全位置・全回転を調べ、
    // 相手の次ターン勝利手を0個にできる壁を最優先する。
    for(let wIdx = 0; wIdx < state.myWalls.length; wIdx++) {
        const wallData = state.myWalls[wIdx];
        for(let r = 0; r <= boardSize; r++) {
            for(let c = 0; c <= boardSize; c++) {
                for(const rot of [0,90,180,270]) {
                    if(aiSearchExpired(actualDeadline)) break;

                    const wallInfo = getWallInfo(r, c, wallData, rot);
                    if(!isValidWallPlacementWithWalls(wallInfo.segments, placedWalls)) continue;

                    const nextWalls = [...placedWalls, wallInfo];
                    const oppPathAfter = getShortestPath(state.oppPos, state.oppTargetRow, nextWalls);
                    const myPathAfter = getShortestPath(state.myPos, state.myTargetRow, nextWalls);
                    if(!oppPathAfter || !myPathAfter) continue;

                    const oppDistAfter = oppPathAfter.length - 1;
                    const myDistAfter = myPathAfter.length - 1;
                    const winningMovesAfter = getImmediateWinningMoves(opponentWho, nextWalls);
                    const oppDelay = oppDistAfter - threat.oppDist;
                    const selfCost = myDistAfter - threat.myDist;
                    const repeatPenalty = isAIWallRecentlyUsed(who, wallInfo) ? 40 : 0;

                    const safe = winningMovesAfter.length === 0;
                    const score = (safe ? 10000000 : 1000000 - winningMovesAfter.length * 250000)
                        + oppDelay * 500
                        + oppDistAfter * 80
                        - Math.max(0, selfCost) * 30
                        - repeatPenalty;

                    const candidate = {
                        type: 'wall',
                        wallInfo: { ...wallInfo, owner: who },
                        wIdx,
                        score,
                        strategy: 'emergency',
                        defense: true,
                        blockedWinningMoves: winningMovesAfter.length,
                        opponentDistanceAfter: oppDistAfter,
                        selfDistanceAfter: myDistAfter,
                        fullyDefendsNextTurn: safe
                    };

                    if(safe) {
                        if(!bestSafe || candidate.score > bestSafe.score) bestSafe = candidate;
                    } else if(!bestFallback || candidate.score > bestFallback.score) {
                        bestFallback = candidate;
                    }
                }
            }
        }
    }

    // 完全防御できる壁が存在するなら、必ずそれを返す。
    // 存在しない場合でも何もしないことは禁止し、最も危険を減らす壁を返す。
    return bestSafe || bestFallback || null;
}

function evaluateUrgentDefense(who, deadline = null) {
    // v7: 「負けそうなら必ず延命」を最優先。
    // 旧版の「oppDist <= 1」だけでは遅すぎるため、
    // 1手詰み / 2手以内で後れ / 3手以内で大幅後れ、を防御開始条件にする。
    const threat = getMandatoryDefenseThreat(who);
    if(!threat) return null;

    const choice = findBestWallAction(who, {
        minDelay: 0,
        maxSelfCost: 999,
        mode: 'urgent',
        searchDepth: 2,
        personality: getSelectedPersonality(who),
        candidateLimit: 260,
        baseMyDist: threat.myDist,
        baseOppDist: threat.oppDist,
        urgent: true,
        mandatoryDefense: true,
        deadline
    });

    return choice;
}

function getWallBranchInfo(who, wall) {
    const state = getMyState(who);
    const before = getValidMovesWithWalls(state.oppPos, placedWalls);
    const after = getValidMovesWithWalls(state.oppPos, [...placedWalls, wall]);
    return { before, after };
}

function evaluateMoveFutureValue(who, move, state, baseMyDist, baseOppDist) {
    const afterMovePath = getShortestPath(move, state.myTargetRow, placedWalls);
    if(!afterMovePath) return -Infinity;

    const afterMyDist = afterMovePath.length - 1;
    const opponentReplies = getValidMovesWithWalls(state.oppPos, placedWalls);
    if(opponentReplies.length === 0) return 0;
    const ownReplies = getValidMovesWithWalls(move, placedWalls);

    // 相手の最善応手を想定し、その後の自分の一手まで読む。
    let worst = Infinity;

    for(const oppMove of opponentReplies) {
        const oppPath = getShortestPath(oppMove, state.oppTargetRow, placedWalls);
        if(!oppPath) continue;

        const oppDist = oppPath.length - 1;
        let bestOwn = -Infinity;

        for(const ownMove of ownReplies) {
            const ownPath = getShortestPath(ownMove, state.myTargetRow, placedWalls);
            if(!ownPath) continue;

            const ownDist = ownPath.length - 1;
            const ownGain = (baseMyDist - ownDist) * 18;
            const pressure = (baseOppDist - oppDist) * 16;
            const finish = ownMove.r === state.myTargetRow ? 100 : 0;

            // 途中で切り捨てても、次の局面で有利になるなら許容する。
            const value = ownGain + pressure + finish;
            if(value > bestOwn) bestOwn = value;
        }

        if(bestOwn === -Infinity) bestOwn = (baseMyDist - afterMyDist) * 18;
        const replyValue = bestOwn + (baseOppDist - oppDist) * 12;

        if(replyValue < worst) worst = replyValue;
    }

    return worst === Infinity ? 0 : worst;
}

function hasTrapReachedHalfway(who) {
    // 罠師だけが使う「相手が盤面の半分まで進んだか」の判定。
    // 相手のスタート側からゴール方向へ進んだ割合で判定し、
    // 5/7/9/11の全サイズで同じ基準になる。
    const opponent = who === 'player' ? 'enemy' : 'player';
    const oppPos = opponent === 'player' ? playerPos : enemyPos;
    const targetRow = opponent === 'player' ? 0 : boardSize - 1;
    const boardSpan = Math.max(1, boardSize - 1);
    const progress = opponent === 'player'
        ? (boardSize - 1 - oppPos.r) / boardSpan
        : oppPos.r / boardSpan;
    return progress >= 0.5;
}

function canTrapUseStrategicWall(who) {
    return hasTrapReachedHalfway(who) || isAIDangerState(who);
}

function chooseAIAction(who, options) {
    const state = getMyState(who);
    // 難易度に関係なく同じAI個体の学習プロフィールを参照する。
    // とくにノーマルモードでは、過去の負け方・勝ち方を次局へ強く反映する。
    const profile = getAIProfile(who);
    const deadline = options.deadline ?? getAIThinkDeadline(who);

    const myPath = getShortestPath(state.myPos, state.myTargetRow, placedWalls);
    const oppPath = getShortestPath(state.oppPos, state.oppTargetRow, placedWalls);
    const myDist = myPath ? myPath.length - 1 : 999;
    const oppDist = oppPath ? oppPath.length - 1 : 999;

    // 自分がこのターンに勝てるなら、他の評価を一切挟まず勝利する。
    const immediateWins = getImmediateWinningMoves(who, placedWalls);
    if(immediateWins.length > 0) {
        const winMove = immediateWins[0];
        return { type: 'move', move: winMove, score: 10000000,
            strategy: 'finish', moveFeatures: getMoveFeatures(who, winMove, state, myDist, oppDist) };
    }

    // ========================================================
    // 性格固有の序盤・罠行動。危険局面では共通防御が優先される。
    // ========================================================
    const personality = options.personality || 'universal';
    const dangerNow = isAIDangerState(who);
    if(personality === 'trickster' && !dangerNow) {
        const opening = getTricksterOpeningAction(who, deadline);
        if(opening) return opening;
    }
    if(personality === 'trap' && !dangerNow && hasTrapReachedHalfway(who)) {
        const trapClose = getTrapClosingWall(who, deadline);
        if(trapClose) return { ...trapClose, type:'wall', strategy:'trapClose' };
    }

    // ========================================================
    // 最優先安全規則
    // 「あと1手で負けるのに壁を残して直進」は全AIで禁止。
    // 性格・難易度・モードよりも先に防御を確定させる。
    // ========================================================
    if(state.myWalls.length > 0) {
        const mandatory = findMandatoryDefenseWall(who, deadline);
        if(mandatory) {
            mandatory.strategy = 'emergency';
            mandatory.threat = {
                myDist,
                oppDist,
                reason: oppDist <= 1 ? 'oneMoveLoss' : 'nearLoss'
            };
            return { ...mandatory, type: 'wall' };
        }
    }

    const moveCandidates = getValidMoves(state.myPos);
    let best = { type: 'move', move: null, score: -Infinity, strategy: 'race' };

    // 移動候補も「単に最短」ではなく、次ターン以降の相手の選択肢を考慮。
    for(const move of moveCandidates) {
        if(aiSearchExpired(deadline)) break;

        const tempMyPath = getShortestPath(move, state.myTargetRow, placedWalls);
        const newMyDist = tempMyPath ? tempMyPath.length - 1 : 999;
        const opponentMoves = getValidMoves(state.oppPos).length;
        const moveFeatures = getMoveFeatures(who, move, state, myDist, oppDist);
        const moveWeights = profile.moveWeights || {};

        let score = 0;
        score += (myDist - newMyDist) * 24 * profile.weights.race;
        score += (moveWeights.progress || 1) * moveFeatures.progress * 5;
        score += (moveWeights.safe || 1) * moveFeatures.safe * 3;
        score += (moveWeights.flexible || 1) * moveFeatures.flexible * 2;
        score += (moveWeights.lure || 1) * moveFeatures.lure * 2;
        score += (moveWeights.ambush || 1) * moveFeatures.ambush * 2;
        score += (moveWeights.wait || 1) * moveFeatures.wait * 2;
        score += (moveWeights.comeback || 1) * moveFeatures.comeback * 3;
        score += (moveWeights.finish || 1) * moveFeatures.finish * 8;
        score += (move.r === state.myTargetRow ? 10000 : 0);
        const moveFutureValue = evaluateMoveFutureValue(who, move, state, myDist, oppDist);
        score += moveFutureValue * 0.72;
        score += opponentMoves * 1.5 * profile.weights.tempo;

        // 全プレイヤーの共有経験を参照する。
        // ただし性格固有評価・ゴール到達保証より下位に置く。
        score += getSharedExperienceScore(who, {
            type: 'move',
            to: { ...move },
            strategy: 'candidate'
        }, buildAIExperienceSituation(who));

        const mode = getSelectedAIMode(who);
        const personality = options.personality || 'universal';
        const lead = myDist - oppDist;
        const progress = myDist - newMyDist;
        const visitCount = getAIMoveVisitCount(who, move);
        if(progress <= 0) score -= 10 + visitCount * 35;
        if(progress > 0) score += 12;
        score -= getAILoopPenalty(who, move);

        // ダイナミックAIは「最短路だけ」ではなく、性格ごとに移動思想を変える。
        if(mode === 'dynamic') {
            if(personality === 'rush') {
                score += progress * 22 * profile.weights.race;
            }

            if(personality === 'ambush') {
                const distance = Math.abs(move.r - state.oppPos.r) + Math.abs(move.c - state.oppPos.c);
                if(distance <= 3) score += 10 * profile.weights.trick;
                if(distance === 1) score += 18 * profile.weights.tempo;
            }

            if(personality === 'trap') {
                // あえて相手に読みやすい場所へ寄せ、次の壁罠につなげる。
                const distance = Math.abs(move.r - state.oppPos.r) + Math.abs(move.c - state.oppPos.c);
                if(distance <= 4) score += 8 * profile.weights.trap;
                if(progress === 0) score += 10 * profile.weights.patience;
            }

            if(personality === 'trickster') {
                // 最短から少し外れる移動を一定確率で評価。完全なランダムにはしない。
                const sideways = Math.abs(move.c - state.myPos.c);
                const offPath = newMyDist > Math.max(0, myDist - 1);
                if(sideways >= 1) score += 12 * profile.weights.trick;
                if(offPath) score += 16 * profile.weights.trick;
                score += (Math.random() - 0.5) * 18 * profile.weights.trick;
            }

            if(personality === 'comeback') {
                if(lead < 0) {
                    score += 18 * profile.weights.comeback;
                    if(progress >= 1) score += 24 * profile.weights.comeback;
                    if(Math.abs(move.c - state.myPos.c) >= 1) score += 5 * profile.weights.trick;
                } else {
                    score -= 4 * profile.weights.comeback;
                }
            }

            if(personality === 'patient') {
                // 序盤の小さな最短距離差だけでは決めない。
                const progressPenalty = Math.max(0, progress);
                score -= progressPenalty * 7 * profile.weights.patience;
                score += opponentMoves * 4 * profile.weights.patience;
                if(lead > 0) score += 12 * profile.weights.patience;
            }

            if(personality === 'ambush') {
                const branches = getRouteBranchProfile(who, placedWalls);
                const rank = branches.branches.findIndex(b => b.move.r === move.r && b.move.c === move.c);
                if(rank >= 0 && rank < 3) score += (3-rank) * 12 * profile.weights.tempo;
                score += Math.max(0, oppDist - newMyDist) * 14 * profile.weights.race;
                if(newMyDist <= oppDist) score += 20 * profile.weights.ambush;
                if(newMyDist > oppDist + 1) score -= 28 * profile.weights.ambush;
            }

            if(personality === 'rush') {
                const branches = getRouteBranchProfile(who, placedWalls);
                const rank = branches.branches.findIndex(b => b.move.r === move.r && b.move.c === move.c);
                if(rank >= 0 && rank < 3) score += (3-rank) * 22 * profile.weights.race;
                else score -= 20 * profile.weights.race;
                if(newMyDist <= myDist) score += 24 * profile.weights.tempo;
            }

            if(personality === 'fortress') {
                const afterOptions = getValidMovesWithWalls(move, placedWalls).length;
                if(afterOptions >= 2) score += 20 * profile.weights.defense;
                if(afterOptions === 1) score -= 20 * profile.weights.defense;
                if(newMyDist <= myDist) score += 12 * profile.weights.race;
            }
        }

        // 相手の正面に近づきすぎる場合は衝突の不確実性を少し避ける。
        const manhattan = Math.abs(move.r - state.oppPos.r) + Math.abs(move.c - state.oppPos.c);
        if(manhattan === 1 && personality !== 'ambush') score -= 2;

        if(isAIMoveRecentlyUsed(who, move)) score -= 45;

        if(personality === 'patient') {
            const sig = getAISignature(who);
            const related = (profile.patternMemory || []).filter(m => m.signature === sig);
            for(const m of related.slice(-12)) {
                const sameMove = m.move && m.move.r === move.r && m.move.c === move.c;
                if(sameMove && m.result === 'loss') score -= 85 * profile.weights.patience;
                if(sameMove && m.result === 'win') score += 42 * profile.weights.patience;
                if(m.result === 'loss' && m.strategy === 'race' && progress <= 0) score -= 35 * profile.weights.patience;
            }
        }

        if(score > best.score) {
            let moveStrategy = 'race';
            if(personality === 'trickster') moveStrategy = 'trick';
            else if(personality === 'trap') moveStrategy = 'lure';
            else if(personality === 'patient') moveStrategy = 'wait';
            else if(personality === 'comeback') moveStrategy = 'comeback';
            else if(personality === 'ambush') moveStrategy = 'ambush';

            best = { type: 'move', move, score, strategy: moveStrategy, moveFeatures };
        }
    }

    if(state.myWalls.length === 0 || !oppPath || !myPath) return best;

    // 時間上限に達したら、ここまでに得た最善手をそのまま返す。
    // 「上限まで必ず待つ」のではなく、早く決まれば即返す。
    if(aiSearchExpired(deadline)) return best;

    // 次の相手ターンで負ける可能性が高い場合は、壁を温存しない。
    const urgentWall = options.urgent ? null : evaluateUrgentDefense(who, deadline);
    if(urgentWall) {
        urgentWall.strategy = 'emergency';
        return { ...urgentWall, type: 'wall' };
    }

    if(aiSearchExpired(deadline)) return best;

    // 罠師型はまず入口を残す罠を仕込み、相手が動いてから閉鎖する。
    if(personality === 'trap' && !dangerNow && hasTrapReachedHalfway(who) && state.myWalls.length > 0) {
        const trapSet = getTrapOpeningCandidate(who, deadline);
        if(trapSet) return { ...trapSet, type:'wall', strategy:'trapSet' };
    }

    // 通常局面でも、相手の最短路を遅らせられるなら壁を優先する。
    // 「互いに直進」が常に最適になるのを防ぎ、妨害を常に候補の中心に置く。
    const trapStrategicWallAllowed = personality !== 'trap' || hasTrapReachedHalfway(who);
    const proactiveWall = trapStrategicWallAllowed ? findBestWallAction(who, {
        minDelay: 0,
        maxSelfCost: options.level === 'dynamic' ? 4 : 3,
        mode: 'all',
        searchDepth: Math.max(1, options.lookAhead || 1),
        personality: options.personality,
        candidateLimit: Math.max(options.candidateLimit || 120, 800),
        baseMyDist: myDist,
        baseOppDist: oppDist,
        proactive: true,
        deadline
    }) : null;
    if(proactiveWall && (proactiveWall.oppDelay > 0 || proactiveWall.blocksImmediateWin)) {
        return { ...proactiveWall, type: 'wall', strategy: proactiveWall.strategy || 'block' };
    }

    if(aiSearchExpired(deadline)) return best;

    const wallChoice = trapStrategicWallAllowed ? findBestWallAction(who, {
        minDelay: options.level === 'dynamic' ? 0 : (options.level === 'special' ? 1 : 2),
        maxSelfCost: options.level === 'dynamic' ? 3 : (options.level === 'special' ? 2 : 1),
        mode: 'all',
        searchDepth: options.lookAhead,
        personality: options.personality,
        candidateLimit: options.candidateLimit,
        baseMyDist: myDist,
        baseOppDist: oppDist,
        deadline
    }) : null;

    if(wallChoice) {
        const wallScore = wallChoice.score;
        if(wallScore > best.score) return { ...wallChoice, type: 'wall' };
    }

    if(aiSearchExpired(deadline)) return best;

    // ========================================================
    // 100手先の戦略予測
    // 直近の評価だけでは「直進し続けて突然負ける」ため、
    // 盤面・壁残量・相手の合法手を再計算しながら100 plyの代表線を読む。
    // 性格による直近評価を壊さないよう、通常時は最終決定の補助として使う。
    // ========================================================
    try {
        const rootStrategicState = {
            p1Pos: { ...playerPos },
            p2Pos: { ...enemyPos },
            p1Walls: playerWalls.map(w => ({ ...w })),
            p2Walls: enemyWalls.map(w => ({ ...w })),
            placedWalls: placedWalls.map(w => ({
                ...w,
                points: w.points ? w.points.map(p => ({ ...p })) : [],
                segments: w.segments ? w.segments.map(seg => ({ ...seg })) : []
            })),
            turn: who
        };

        const longPlan = evaluateLongHorizon100(rootStrategicState, who, deadline);
        const firstPlan = longPlan?.line?.[0];

        if(firstPlan) {
            const longStateAfter = applyStrategicAction(rootStrategicState, who, firstPlan);
            const longStrategicScore = evaluateStrategicPosition(longStateAfter, who);
            const longRange = evaluateOpponentBenefitRange(longStateAfter, who);
            const safetyGain = -longRange.upper;

            // 長期線の安全性が明確に高い場合は、現在の性格より安全を優先。
            // 逆に差が小さい場合は既存の性格スコアを尊重する。
            const longBonus = Math.max(-35, Math.min(55,
                longStrategicScore * 0.18 + safetyGain * 0.22
            ));

            if(firstPlan.type === 'move') {
                const sameMove = best.type === 'move' && best.move &&
                    best.move.r === firstPlan.move.r && best.move.c === firstPlan.move.c;

                if(sameMove) {
                    best.score += longBonus;
                    best.longHorizon = {
                        depth: longPlan.depth,
                        score: longPlan.score,
                        firstAction: 'move'
                    };
                } else if(best.type === 'move' && best.move) {
                    const currentStateAfter = applyStrategicAction(rootStrategicState, who, {
                        type: 'move',
                        move: { ...best.move }
                    });
                    const currentLongSafety = evaluateStrategicPosition(currentStateAfter, who);
                    const currentRange = evaluateOpponentBenefitRange(currentStateAfter, who);
                    const currentSafety = -currentRange.upper;

                    // 「勝てる可能性」より「負け筋を消せるか」を優先する。
                    if(longStrategicScore > currentLongSafety + 22 ||
                       safetyGain > currentSafety + 28) {
                        best = {
                            ...best,
                            move: { ...firstPlan.move },
                            score: best.score + longBonus + 8,
                            strategy: best.strategy === 'race' ? 'longPlan' : best.strategy,
                            longHorizon: {
                                depth: longPlan.depth,
                                score: longPlan.score,
                                firstAction: 'move'
                            }
                        };
                    }
                }
            } else if(firstPlan.type === 'wall') {
                const wallCandidates = getCandidateWallPlacements(who, Math.max(80, options.candidateLimit || 120), deadline);
                const matching = wallCandidates.find(c =>
                    c.wIdx === firstPlan.wIdx &&
                    strategicWallEquals(c.wallInfo, firstPlan.wallInfo)
                );

                if(matching) {
                    const wallPlanScore = longStrategicScore + safetyGain * 0.9;

                    // 長期線が「壁を使って相手の最大利益を潰す」なら採用。
                    if(options.level === 'special' || options.level === 'dynamic' ||
                       wallPlanScore > best.score * 0.55 ||
                       safetyGain > 45) {
                        best = {
                            type: 'wall',
                            wallInfo: { ...matching.wallInfo, owner: who },
                            wIdx: matching.wIdx,
                            score: Math.max(best.score, wallPlanScore),
                            strategy: 'longDefense',
                            longHorizon: {
                                depth: longPlan.depth,
                                score: longPlan.score,
                                firstAction: 'wall',
                                opponentBenefitLower: longRange.lower,
                                opponentBenefitUpper: longRange.upper,
                                opponentBenefitMean: longRange.mean
                            }
                        };
                    }
                }
            }
        }
    } catch(e) {
        console.warn('100手戦略探索をスキップ:', e);
    }

    return best;
}

function getCandidateWallPlacements(who, candidateLimit = 200, deadline = null) {
    const state = getMyState(who);
    const candidates = [];
    const seen = new Set();

    const oppPath = getShortestPath(state.oppPos, state.oppTargetRow, placedWalls) || [];
    const myPath = getShortestPath(state.myPos, state.myTargetRow, placedWalls) || [];

    // 最短路の周辺を優先して調べる。単純な左上からの走査をやめることで、
    // 盤面の後半にある強い壁候補を取りこぼさない。
    const anchors = [...oppPath.slice(0, 8), ...oppPath.slice(-5), ...myPath.slice(0, 6)];
    const positions = [];

    anchors.forEach(a => {
        for(let dr = -2; dr <= 2; dr++) {
            for(let dc = -2; dc <= 2; dc++) {
                const r = a.r + dr;
                const c = a.c + dc;
                if(r >= 0 && r <= boardSize && c >= 0 && c <= boardSize) {
                    const key = `${r},${c}`;
                    if(!seen.has(key)) {
                        seen.add(key);
                        positions.push({r,c});
                    }
                }
            }
        }
    });

    // 全域も混ぜる。性格によって重要な端・中央の候補を失わないため。
    for(let r = 0; r <= boardSize; r++) {
        for(let c = 0; c <= boardSize; c++) {
            const key = `${r},${c}`;
            if(!seen.has(key)) positions.push({r,c});
        }
    }

    // 乱数を少量入れ、同じ盤面サイズで候補順が固定されることを防ぐ。
    for(let i = positions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [positions[i], positions[j]] = [positions[j], positions[i]];
    }

    // ただし最短路周辺を再び先頭に戻す。
    const priority = [];
    const normal = [];
    const anchorSet = new Set(anchors.map(a => `${a.r},${a.c}`));
    positions.forEach(pos => {
        if(anchorSet.has(`${pos.r},${pos.c}`)) priority.push(pos);
        else normal.push(pos);
    });
    const orderedPositions = [...priority, ...normal];

    for(let wIdx = 0; wIdx < state.myWalls.length; wIdx++) {
        const wallData = state.myWalls[wIdx];

        for(const pos of orderedPositions) {
            if(aiSearchExpired(deadline)) return candidates;

            for(let rot of [0, 90, 180, 270]) {
                if(aiSearchExpired(deadline)) return candidates;

                const wallInfo = getWallInfo(pos.r, pos.c, wallData, rot);
                if(isValidWallPlacement(wallInfo.segments)) {
                    candidates.push({ wallInfo, wIdx });
                    if(candidates.length >= candidateLimit) return candidates;
                }
            }
        }
    }
    return candidates;
}
function evaluateWallFutureValue(who, firstCandidate, state, baseMyDist, baseOppDist, candidatePool, options) {
    const firstWall = firstCandidate.wallInfo;
    const firstWalls = [...placedWalls, firstWall];

    const firstOppPath = getShortestPath(state.oppPos, state.oppTargetRow, firstWalls);
    const firstMyPath = getShortestPath(state.myPos, state.myTargetRow, firstWalls);
    if(!firstOppPath || !firstMyPath) return null;

    const firstOppDist = firstOppPath.length - 1;
    const firstMyDist = firstMyPath.length - 1;
    const firstOppDelay = firstOppDist - baseOppDist;
    const firstSelfCost = firstMyDist - baseMyDist;

    // 1枚だけの評価ではなく、「相手の返し→2枚目→自分の次の一手」まで読む。
    const replies = getValidMovesWithWalls(state.oppPos, firstWalls);
    if(replies.length === 0) return null;

    const secondPool = candidatePool.filter(c => c.wIdx !== firstCandidate.wIdx).slice(0, options.futureCandidateLimit || 28);
    let worstCase = Infinity;
    let worstPlan = null;

    for(const reply of replies) {
        if(aiSearchExpired(options.deadline)) return worstCase === Infinity ? null : {
            value: worstCase,
            firstOppDelay,
            firstSelfCost,
            firstOppDist,
            firstMyDist,
            second: worstPlan?.secondCandidate || null,
            ownMove: worstPlan?.bestOwnMove || null,
            opponentReply: worstPlan?.reply || null
        };

        let bestReplyValue = -Infinity;
        let bestReplyPlan = null;

        // 相手は自分にとって最も都合の悪い返しを選ぶと仮定する。
        for(const secondCandidate of secondPool) {
            if(aiSearchExpired(options.deadline)) break;

            const secondWall = secondCandidate.wallInfo;
            const secondWalls = [...firstWalls, secondWall];

            if(!isValidWallPlacementWithWalls(secondWall.segments, firstWalls)) continue;

            const afterSecondOppPath = getShortestPath(reply, state.oppTargetRow, secondWalls);
            const afterSecondMyPath = getShortestPath(state.myPos, state.myTargetRow, secondWalls);
            if(!afterSecondOppPath || !afterSecondMyPath) continue;

            const afterSecondOppDist = afterSecondOppPath.length - 1;
            const afterSecondMyDist = afterSecondMyPath.length - 1;
            const nextOppDist = afterSecondOppDist;

            // 2枚目を置いた直後の「相手への圧力」と「自分の損失」を見る。
            let value =
                (afterSecondOppDist - baseOppDist) * 24 * (options.blockWeight || 1)
                - Math.max(0, afterSecondMyDist - baseMyDist) * 22 * (options.defenseWeight || 1);

            // その後の自分の一手まで読む。
            const myReplies = getValidMovesWithWalls(state.myPos, secondWalls);
            // ownMoveごとに同じ相手経路を再計算していたため、2枚目候補単位で1回だけ求める。
            const cachedNextOppDist = afterSecondOppDist;
            let bestOwnMoveGain = -Infinity;
            let bestOwnMove = null;

            for(const ownMove of myReplies) {
                if(aiSearchExpired(options.deadline)) break;

                const ownPath = getShortestPath(ownMove, state.myTargetRow, secondWalls);
                if(!ownPath) continue;

                const ownDist = ownPath.length - 1;
                const gain = (baseMyDist - ownDist) * 22 + (ownMove.r === state.myTargetRow ? 80 : 0);

                // 次の相手の最短路まで確認。単純な「今だけ遅延」を避ける。
                const nextOppDist = cachedNextOppDist;
                const futurePressure = Math.max(0, nextOppDist - baseOppDist);
                const combined = gain + futurePressure * 18;

                if(combined > bestOwnMoveGain) {
                    bestOwnMoveGain = combined;
                    bestOwnMove = { ...ownMove };
                }
            }

            if(bestOwnMoveGain > -Infinity) value += bestOwnMoveGain;

            // 壁を2枚連続で使うこと自体には大きなコストを課す。
            // 「組み合わせで大きな利益」が出た時だけ、このコストを上回れるようにする。
            value -= 26 * (options.reserveWeight || 1);

            // 2枚目を使った後に壁0になる場合、緊急時以外はほぼ選ばない。
            const wallsAfterTwo = state.myWalls.length - 2;
            if(!options.urgent && wallsAfterTwo <= 0) value -= 90 * (options.reserveWeight || 1);
            else if(!options.urgent && wallsAfterTwo === 1) value -= 38 * (options.reserveWeight || 1);

            if(value > bestReplyValue) {
                bestReplyValue = value;
                bestReplyPlan = {
                    secondCandidate,
                    bestOwnMove,
                    value,
                    afterSecondOppDist,
                    afterSecondMyDist
                };
            }
        }

        if(bestReplyValue === -Infinity) continue;

        // 相手の返しの中で最悪のものを採用する。
        if(bestReplyValue < worstCase) {
            worstCase = bestReplyValue;
            worstPlan = {
                reply: { ...reply },
                ...bestReplyPlan
            };
        }
    }

    if(worstCase === Infinity) return null;

    return {
        value: worstCase,
        firstOppDelay,
        firstSelfCost,
        firstOppDist,
        firstMyDist,
        second: worstPlan?.secondCandidate || null,
        ownMove: worstPlan?.bestOwnMove || null,
        opponentReply: worstPlan?.reply || null
    };
}

function findBestWallAction(who, options = {}) {
    const deadline = options.deadline ?? null;
    const state = getMyState(who);
    const profile = (options.level === 'special' || options.level === 'dynamic')
        ? getAIProfile(who)
        : createDefaultAIProfile(options.personality || 'universal');

    const baseMyPath = getShortestPath(state.myPos, state.myTargetRow, placedWalls);
    const baseOppPath = getShortestPath(state.oppPos, state.oppTargetRow, placedWalls);
    if(!baseMyPath || !baseOppPath || state.myWalls.length === 0) return null;

    const baseMyDist = options.baseMyDist ?? (baseMyPath.length - 1);
    const baseOppDist = options.baseOppDist ?? (baseOppPath.length - 1);

    const allCandidates = getCandidateWallPlacements(
        who,
        options.candidateLimit || (options.level === 'special' ? 320 : 180),
        deadline
    );

    // まず軽い1枚評価で候補を絞り、その後にだけ数手先を読む。
    // これで「毎回すべての壁の組み合わせ」を計算して重くなるのを防ぐ。
    const immediateCandidates = [];
    // 候補ごとに変わらない値は1回だけ計算する。
    const oppOptionsBeforeBase = getValidMovesWithWalls(state.oppPos, placedWalls).length;

    for(const candidate of allCandidates) {
        if(aiSearchExpired(deadline)) break;

        const wall = candidate.wallInfo;
        const tempWalls = [...placedWalls, wall];

        const newOppPath = getShortestPath(state.oppPos, state.oppTargetRow, tempWalls);
        const newMyPath = getShortestPath(state.myPos, state.myTargetRow, tempWalls);
        if(!newOppPath || !newMyPath) continue;

        const newOppDist = newOppPath.length - 1;
        const newMyDist = newMyPath.length - 1;
        const oppDelay = newOppDist - baseOppDist;
        const selfCost = newMyDist - baseMyDist;
        const opponentWho = who === 'player' ? 'enemy' : 'player';
        const blocksImmediateWin = getImmediateWinningMoves(opponentWho, tempWalls).length === 0 &&
            getImmediateWinningMoves(opponentWho, placedWalls).length > 0;

        if(selfCost > (options.maxSelfCost ?? 2)) continue;

        const oppOptionsBefore = oppOptionsBeforeBase;
        const oppOptionsAfter = getValidMovesWithWalls(state.oppPos, tempWalls).length;

        let immediate =
            oppDelay * 28 * profile.weights.block
            - Math.max(0, selfCost) * 26 * profile.weights.defense;

        immediate += Math.max(0, oppOptionsBefore - oppOptionsAfter) * 7 * profile.weights.block;

        // 「二択封じ」ではなく、「二択を作って相手を泳がせる」ことを基本にする。
        // 二択にしただけで大きなボーナスは与えない。
        if(oppOptionsAfter === 2 && oppOptionsBefore >= 3) {
            immediate += 6 * profile.weights.trap;
        }

        // 一本道化も「即封鎖の正解」にはしない。長期的に得かどうかで判断する。
        if(oppOptionsAfter === 1 && oppOptionsBefore >= 2) {
            immediate += 8 * profile.weights.block;
        }

        // 早いターンの壁は強く抑制する。初手の壁浪費を特に避ける。
        if(!options.urgent) {
            if(totalTurnCount <= 2) immediate -= 58 * profile.weights.patience;
            else if(totalTurnCount <= 5) immediate -= 30 * profile.weights.patience;
        }

        const wallsAfter = state.myWalls.length - 1;
        if(!options.urgent) {
            if(wallsAfter <= 0) immediate -= 115 * profile.weights.patience;
            else if(wallsAfter === 1) immediate -= 52 * profile.weights.patience;
            else if(wallsAfter === 2) immediate -= 20 * profile.weights.patience;
        }

        // 「今は大きく塞がず、後で最大化」の泳がせ。
        if(!options.urgent && state.myWalls.length >= 3 &&
           oppDelay <= 1 && oppOptionsAfter >= 2) {
            immediate += 10 * profile.weights.patience;
        }

        immediateCandidates.push({ candidate, immediate, oppDelay, selfCost, oppOptionsAfter, blocksImmediateWin });
    }

    immediateCandidates.sort((a,b) => b.immediate - a.immediate);

    const firstLimit = options.urgent ? 90 : (options.level === 'special' ? 55 : 38);
    const firstCandidates = immediateCandidates.slice(0, firstLimit);

    let best = null;

    for(const item of firstCandidates) {
        if(aiSearchExpired(deadline)) break;

        const candidate = item.candidate;
        const wall = candidate.wallInfo;
        const tempWalls = [...placedWalls, wall];

        const newOppPath = getShortestPath(state.oppPos, state.oppTargetRow, tempWalls);
        const newMyPath = getShortestPath(state.myPos, state.myTargetRow, tempWalls);
        if(!newOppPath || !newMyPath) continue;

        const newOppDist = newOppPath.length - 1;
        const newMyDist = newMyPath.length - 1;
        const oppDelay = newOppDist - baseOppDist;
        const selfCost = newMyDist - baseMyDist;
        const oppOptionsBefore = oppOptionsBeforeBase;
        const oppOptionsAfter = getValidMovesWithWalls(state.oppPos, tempWalls).length;

        let strategy = 'block';
        let score = item.immediate;

        if(options.proactive) {
            if(item.blocksImmediateWin) score += 300000;
            if(oppDelay > 0) score += oppDelay * 600;
            else score -= 120;
        }

        if(isAIWallRecentlyUsed(who, wall)) score -= 60;

        // 相手に2択を迫る。ただし「次に必ず塞ぐ」のではなく、
        // 相手がどちらを選ぶかを観測し、泳がせてから最大の利益を取る。
        if(oppOptionsAfter === 2 && oppOptionsBefore >= 3 && state.myWalls.length >= 2) {
            strategy = 'twoChoice';
            score += 4 * profile.weights.trap;
            if(state.myWalls.length >= 4) score += 10 * profile.weights.patience;
        }

        // 一本化は強制的に選ばず、相手の進路が自分にとって都合よくなる場合だけ。
        if(oppOptionsAfter === 1 && oppOptionsBefore >= 2 && oppDelay >= 1) {
            strategy = 'oneWay';
            score += 10 * profile.weights.block;
        }

        // 泳がせ：即時の遅延が小さくても、次の壁の候補を残せるなら価値を与える。
        if(!options.urgent && state.myWalls.length >= 3 &&
           oppDelay <= 1 && oppOptionsAfter >= 2) {
            strategy = 'swim';
            score += 12 * profile.weights.patience;
        }

        // 二択を作った後の「選択された枝」を即封じする評価は弱める。
        // それより、相手を動かした後に組み合わせで最大利益を取る。
        const future = evaluateWallFutureValue(who, candidate, state, baseMyDist, baseOppDist,
            allCandidates, {
                urgent: !!options.urgent,
                futureCandidateLimit: options.urgent ? 10 : 24,
                blockWeight: profile.weights.block,
                defenseWeight: profile.weights.defense,
                reserveWeight: profile.weights.patience
            });

        if(future) {
            score += future.value * 0.78;

            // 2枚目まで含めて大きな利得が見込める場合のみ、壁コンボを強く評価。
            if(future.second) {
                const comboGain =
                    Math.max(0, future.afterSecondOppDist - baseOppDist) * 20
                    + Math.max(0, baseMyDist - future.afterSecondMyDist) * 12;

                score += comboGain * profile.weights.block;

                if(comboGain >= 55) strategy = strategy === 'twoChoice' ? 'twoChoiceSwim' : 'combo';
            }
        }

        // 既に壁を十分持っている時は、今使う1枚だけでなく「次に使える2枚目」が
        // 残ることを評価する。
        const wallsAfter = state.myWalls.length - 1;
        if(!options.urgent) {
