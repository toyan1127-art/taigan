<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>対岸渡し - RPG Edition</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Shippori+Mincho:wght@700&display=swap');

    body {
        font-family: 'Shippori Mincho', 'Arial', serif;
        background: #0d0b14 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.05"><path d="M0 0h100v100H0z" fill="none"/><path d="M0 50h100M50 0v100" stroke="%23fff" stroke-width="1"/></svg>');
        color: #e0d5c1;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        user-select: none;
        overflow-x: hidden;
    }

    .rpg-frame {
        background: rgba(20, 15, 28, 0.95);
        border: 3px solid #b8860b;
        box-shadow: 0 0 15px rgba(0,0,0,0.8), inset 0 0 15px rgba(184, 134, 11, 0.2);
        border-radius: 8px;
        padding: 20px;
        position: relative;
    }

    h1 {
        font-family: 'Cinzel', 'Shippori Mincho', serif;
        color: #f1c40f;
        text-shadow: 0 0 10px rgba(241, 196, 15, 0.5), 2px 2px 4px #000;
        margin-top: 0;
        text-align: center;
    }

    #setup-screen, #game-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 1000px;
    }

    #game-screen {
        position: relative;
    }

    .retire-btn {
        position: absolute;
        top: 0;
        left: 0;
        padding: 6px 14px;
        font-size: 14px;
        background: #4a0000;
        border: 2px solid #a93226;
        color: #e74c3c;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
        z-index: 50;
    }
    .retire-btn:hover {
        background: #8b0000;
        color: #fff;
        border-color: #f1c40f;
        box-shadow: 0 0 8px rgba(231, 76, 60, 0.6);
    }

    .setup-group {
        margin: 10px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 360px;
    }

    label {
        color: #d4af37;
        font-weight: bold;
    }

    select, button {
        padding: 8px 16px;
        font-size: 16px;
        background: #2a1b0a;
        color: #f39c12;
        border: 2px solid #8b5a2b;
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
    }

    select:hover, button:hover {
        background: #4a2c0f;
        border-color: #f1c40f;
        color: #fff;
        box-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
    }

    .btn-large {
        font-size: 20px;
        padding: 12px 36px;
        margin-top: 15px;
        background: linear-gradient(180deg, #8b0000, #4a0000);
        border-color: #d4af37;
        color: #f1c40f;
        font-weight: bold;
        text-shadow: 1px 1px 2px #000;
    }
    .btn-large:hover {
        background: linear-gradient(180deg, #a52a2a, #5c0000);
    }

    #game-layout {
        display: grid;
        grid-template-columns: 240px auto 240px;
        gap: 20px;
        align-items: center;
        margin-top: 10px;
    }

    #enemy-wall-area {
        grid-column: 3;
        align-self: start;
        background: rgba(40, 10, 10, 0.9);
        border: 2px solid #a93226;
        padding: 12px;
        border-radius: 8px;
        max-height: 80vh;
        overflow-y: auto;
    }

    #board-wrapper {
        grid-column: 2;
        position: relative;
        background: #18120c;
        padding: 16px;
        border: 4px solid #5c3a21;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.8);
    }

    #player-wall-area {
        grid-column: 1;
        align-self: end;
        background: rgba(40, 25, 10, 0.9);
        border: 2px solid #e67e22;
        padding: 12px;
        border-radius: 8px;
        max-height: 80vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }

    .wall-section-title {
        margin: 0 0 10px 0;
        font-size: 16px;
        text-align: center;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        padding-bottom: 5px;
    }

    #board {
        display: grid;
        background-color: #2b1d0c;
        position: relative;
        border: 2px solid #422a18;
        overflow: visible;
    }

    .goal-line {
        position: absolute;
        left: 0;
        width: 100%;
        height: 6px;
        z-index: 15;
        pointer-events: none;
        border-radius: 3px;
    }
    #player-goal-line {
        top: -3px;
        background-color: rgba(241, 196, 15, 0.85);
        box-shadow: 0 0 12px rgba(241, 196, 15, 0.9);
    }
    #enemy-goal-line {
        bottom: -3px;
        background-color: rgba(231, 76, 60, 0.85);
        box-shadow: 0 0 12px rgba(231, 76, 60, 0.9);
    }

    .cell {
        background-color: #4a3525;
        border: 1px solid #362519;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-sizing: border-box;
        transition: background-color 0.2s;
        z-index: 1;
    }
    .cell:hover {
        background-color: #5c4331;
    }
    .cell.blink {
        animation: blinker 0.8s linear infinite;
        background-color: #d35400 !important;
    }
    @keyframes blinker {
        50% { opacity: 0.5; }
    }

    /* 設置済み壁はセルより常に前面に表示する。 */
    .wall-svg-layer {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100%;
        height: 100%;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: none;
        z-index: 1000 !important;
        overflow: visible !important;
        isolation: isolate;
    }

    .wall-preview-overlay {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100%;
        height: 100%;
        display: block !important;
        visibility: visible !important;
        pointer-events: none;
        z-index: 1001 !important;
        overflow: visible !important;
    }

    #board > .cell {
        position: relative;
        z-index: 1;
    }

    .wall-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .wall-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        border: 2px solid #5c3a21;
        background: #1c140e;
        border-radius: 6px;
    }
    .interactive-wall .wall-item {
        cursor: pointer;
    }
    .interactive-wall .wall-item:hover {
        background: #2a2018;
        border-color: #ff8c00;
    }
    .wall-item.selected {
        border-color: #2ecc71 !important;
        background: #14281d !important;
    }
    .wall-icon-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 60px;
        height: 40px;
    }
    .wall-count {
        font-weight: bold;
        font-size: 16px;
        color: #f1c40f;
    }

    #timer {
        font-size: 22px;
        margin-bottom: 5px;
        font-weight: bold;
        color: #e67e22;
        text-shadow: 0 0 5px rgba(0,0,0,0.8);
    }
    #turn-indicator {
        font-size: 20px;
        margin-bottom: 10px;
        color: #e67e22;
        font-weight: bold;
    }

    /* ターン切り替えを明確にする表示 */
    #game-screen.turn-changing #game-layout {
        pointer-events: none;
        filter: brightness(0.55);
        transition: filter 0.15s ease;
    }

    #turn-transition {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 40000;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        background: rgba(0,0,0,0.42);
    }

    #turn-transition.show {
        display: flex;
        animation: turnFadeIn 0.18s ease-out both;
    }

    .turn-transition-box {
        min-width: 330px;
        max-width: 80%;
        padding: 22px 34px;
        text-align: center;
        background: rgba(15,10,20,0.96);
        border: 3px solid #d4af37;
        border-radius: 12px;
        box-shadow: 0 0 35px rgba(0,0,0,0.9), 0 0 18px rgba(241,196,15,0.22);
    }

    .turn-transition-end {
        font-size: 18px;
        color: #aaa;
        margin-bottom: 8px;
    }

    .turn-transition-next {
        font-size: 30px;
        font-weight: bold;
        color: #f1c40f;
        text-shadow: 0 0 12px rgba(241,196,15,0.7);
    }

    .turn-transition-sub {
        margin-top: 8px;
        font-size: 14px;
        color: #ddd;
    }

    @keyframes turnFadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to   { opacity: 1; transform: scale(1); }
    }

    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(5, 3, 10, 0.94);
        z-index: 50000 !important;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        isolation: isolate;
    }

    /* 結果画面は盤面・壁・演出より常に最前面。 */
    #win-modal,
    #lose-modal,
    #coin-modal {
        position: fixed !important;
        inset: 0 !important;
        z-index: 50000 !important;
    }

    #win-modal {
        background:
            radial-gradient(circle at center, rgba(80,55,5,0.35), rgba(5,3,10,0.96) 70%),
            rgba(5,3,10,0.96);
    }

    #lose-modal {
        background:
            radial-gradient(circle at center, rgba(90,0,0,0.22), rgba(2,2,5,0.98) 68%),
            rgba(2,2,5,0.98);
        overflow: hidden;
    }

    #lose-modal::before,
    #lose-modal::after {
        content: "";
        position: absolute;
        inset: -10%;
        pointer-events: none;
    }

    #lose-modal::before {
        background:
            radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.78) 78%, #000 100%);
        animation: despairVignette 2.4s ease-in-out infinite alternate;
        z-index: -1;
    }

    #lose-modal::after {
        background:
            repeating-linear-gradient(90deg, transparent 0 18px, rgba(231,76,60,0.025) 19px 20px);
        opacity: 0.45;
        animation: despairFlicker 0.22s steps(2) infinite;
        z-index: -1;
    }

    #lose-modal .result-box {
        animation: despairEnter 0.75s cubic-bezier(.2,.8,.2,1) both, despairPulse 2.8s ease-in-out 0.8s infinite;
        border-color: #5a1b1b;
        box-shadow: 0 0 45px rgba(0,0,0,0.98), 0 0 25px rgba(120,0,0,0.22), inset 0 0 35px rgba(0,0,0,0.75);
    }

    #lose-modal .lose-title {
        animation: despairTitle 1.2s ease-out both;
    }

    #lose-modal .skull-icon-large {
        animation: skullDrop 0.9s ease-out 0.15s both, skullPulse 2.2s ease-in-out 1.1s infinite;
    }

    @keyframes despairVignette {
        from { opacity: 0.72; transform: scale(1); }
        to   { opacity: 1; transform: scale(1.06); }
    }

    @keyframes despairFlicker {
        0%, 100% { opacity: 0.22; }
        50% { opacity: 0.5; }
    }

    @keyframes despairEnter {
        0% { opacity: 0; transform: translateY(35px) scale(0.92); filter: grayscale(1) blur(4px); }
        55% { opacity: 1; transform: translateY(-5px) scale(1.015); filter: grayscale(0.7) blur(0); }
        100% { opacity: 1; transform: translateY(0) scale(1); filter: grayscale(0); }
    }

    @keyframes despairPulse {
        0%, 100% { box-shadow: 0 0 45px rgba(0,0,0,0.98), 0 0 25px rgba(120,0,0,0.22), inset 0 0 35px rgba(0,0,0,0.75); }
        50% { box-shadow: 0 0 55px rgba(0,0,0,1), 0 0 8px rgba(120,0,0,0.12), inset 0 0 45px rgba(0,0,0,0.9); }
    }

    @keyframes despairTitle {
        0% { opacity: 0; transform: scale(1.35); letter-spacing: 12px; filter: blur(8px); }
        65% { opacity: 1; transform: scale(0.98); letter-spacing: 1px; filter: blur(0); }
        100% { transform: scale(1); letter-spacing: 0; }
    }

    @keyframes skullDrop {
        0% { opacity: 0; transform: translateY(-55px) scale(1.6) rotate(-8deg); filter: brightness(2) blur(5px); }
        100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); filter: brightness(0.65) blur(0); }
    }

    @keyframes skullPulse {
        0%, 100% { transform: scale(1); opacity: 0.72; }
        50% { transform: scale(0.94); opacity: 0.45; }
    }

    #coin {
        width: 100px;
        height: 100px;
        background: radial-gradient(circle, #ffe066, #b8860b);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        color: #2c1d11;
        font-weight: bold;
        border: 4px solid #fff8dc;
        box-shadow: 0 0 20px rgba(241, 196, 15, 0.6);
    }
    .flip {
        animation: flipAnim 2s forwards;
    }
    @keyframes flipAnim {
        0% { transform: translateY(0) rotateX(0deg); }
        50% { transform: translateY(-150px) rotateX(1800deg); }
        100% { transform: translateY(0) rotateX(3600deg); }
    }

    .result-box {
        background: #140d1a;
        border: 4px solid #b8860b;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        max-width: 650px;
        width: 90%;
        box-shadow: 0 0 30px rgba(0,0,0,0.9);
        position: relative;
        z-index: 50001 !important;
    }
    .result-title {
        font-size: 36px;
        margin-bottom: 15px;
        font-family: 'Cinzel', 'Shippori Mincho', serif;
    }
    .win-title {
        color: #f1c40f;
        text-shadow: 0 0 15px rgba(241, 196, 15, 0.8);
    }
    .lose-title {
        color: #e74c3c;
        text-shadow: 0 0 15px rgba(231, 76, 60, 0.8);
    }
    .turn-count-display {
        font-size: 20px;
        color: #ddd;
        margin-bottom: 20px;
    }

    .skull-icon-large {
        width: 100px;
        height: 100px;
        margin: 10px auto 20px auto;
        filter: drop-shadow(0 0 10px rgba(231, 76, 60, 0.6));
    }

    .taunt-container {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid #5c2020;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        max-height: 220px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: left;
    }
    .taunt-item {
        font-size: 14px;
        color: #e6b0aa;
        line-height: 1.4;
        word-wrap: break-word;
        white-space: normal;
        border-bottom: 1px dashed rgba(231, 76, 60, 0.2);
        padding-bottom: 4px;
    }

    #confetti-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 49000 !important;
    }
    
    #evolution-badge {
        font-size: 13px;
        color: #2ecc71;
        margin-top: 6px;
        font-weight: bold;
    }

    /* ============================================================
       スマホ対応
       タップ操作・可変盤面・上下の壁カード配置
       ============================================================ */
    html, body {
        width: 100%;
        max-width: 100%;
        touch-action: manipulation;
    }

    button, select, .wall-item, .cell {
        -webkit-tap-highlight-color: transparent;
    }

    #rotate-wall-btn {
        min-height: 42px;
        padding: 8px 14px;
        font-size: 15px;
        font-weight: bold;
        background: linear-gradient(180deg, #6b430f, #2a1b0a);
        border-color: #d4af37;
        color: #f1c40f;
        white-space: nowrap;
    }

    #rotate-wall-btn:active {
        transform: scale(0.96);
    }

    .wall-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
    }

    .rotation-display {
        font-size: 13px;
        color: #ddd;
        min-width: 55px;
        text-align: center;
    }

    /* スマホ用：選択した壁を中央付近に表示し、左下の十字キーで移動する。 */
    #mobile-wall-controller {
        display: none;
    }

    @media (max-width: 700px) {
        #mobile-wall-controller {
            position: fixed;
            left: 10px;
            bottom: max(10px, env(safe-area-inset-bottom));
            width: 154px;
            padding: 8px;
            box-sizing: border-box;
            background: rgba(15, 10, 20, 0.94);
            border: 2px solid #d4af37;
            border-radius: 10px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.7);
            z-index: 45000;
            touch-action: manipulation;
        }

        #mobile-wall-controller.active {
            display: block;
        }

        .mobile-wall-controller-title {
            text-align: center;
            color: #f1c40f;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .mobile-dpad {
            width: 108px;
            height: 108px;
            margin: 0 auto 7px;
            display: grid;
            grid-template-columns: repeat(3, 36px);
            grid-template-rows: repeat(3, 36px);
            justify-content: center;
        }

        .dpad-btn {
            width: 36px;
            height: 36px;
            min-height: 36px;
            padding: 0;
            margin: 0;
            border: 1px solid #8b5a2b;
            background: #2a1b0a;
            color: #f1c40f;
            font-size: 17px;
            line-height: 1;
            touch-action: manipulation;
        }

        .dpad-btn:active,
        .mobile-wall-actions button:active {
            transform: scale(0.92);
            background: #4a2c0f;
        }

        .dpad-up { grid-column: 2; grid-row: 1; border-radius: 7px 7px 3px 3px; }
        .dpad-left { grid-column: 1; grid-row: 2; border-radius: 7px 3px 3px 7px; }
        .dpad-center { grid-column: 2; grid-row: 2; color: #aaa; font-size: 11px; }
        .dpad-right { grid-column: 3; grid-row: 2; border-radius: 3px 7px 7px 3px; }
        .dpad-down { grid-column: 2; grid-row: 3; border-radius: 3px 3px 7px 7px; }

        .mobile-wall-actions {
            display: flex;
            gap: 5px;
        }

        .mobile-wall-actions button {
            flex: 1;
            min-height: 36px;
            padding: 5px 4px;
            font-size: 12px;
            font-weight: bold;
            touch-action: manipulation;
        }

        #mobile-place-wall-btn {
            border-color: #2ecc71;
            color: #2ecc71;
        }

        #mobile-cancel-wall-btn {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        #mobile-place-wall-btn:disabled,
        .dpad-btn:disabled {
            opacity: 0.4;
        }
    }

        body {
            min-height: 100dvh;
            height: 100dvh;
            overflow: hidden;
            justify-content: flex-start;
        }

        #setup-screen {
            box-sizing: border-box;
            width: min(96vw, 520px);
            max-height: 96dvh;
            overflow-y: auto;
            padding: 14px;
        }

        #setup-screen h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .setup-group {
            width: min(92vw, 360px);
            margin: 7px 0;
        }

        select, button {
            min-height: 42px;
        }

        #game-screen {
            box-sizing: border-box;
            width: 100vw;
            height: 100dvh;
            max-width: none;
            padding: 4px 4px 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-screen .retire-btn {
            top: 4px;
            left: 4px;
            padding: 5px 9px;
            font-size: 12px;
            z-index: 100;
        }

        #timer {
            font-size: 16px;
            margin: 1px 0 0;
        }

        #turn-indicator {
            font-size: 18px !important;
            margin: 1px 0 3px;
            line-height: 1.1;
        }

        #game-layout {
            width: 100%;
            height: calc(100dvh - 62px);
            margin-top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 2px;
            min-height: 0;
        }

        #enemy-wall-area,
        #player-wall-area {
            box-sizing: border-box;
            width: 100%;
            max-width: 100%;
            min-height: 48px;
            max-height: 76px;
            padding: 3px 5px;
            border-width: 1px;
            border-radius: 6px;
            overflow: hidden;
            flex: 0 0 auto;
        }

        #enemy-wall-area {
            order: 1;
            align-self: center;
        }

        #board-wrapper {
            order: 2;
            box-sizing: border-box;
            padding: 4px;
            border-width: 2px;
            border-radius: 6px;
            max-width: 100%;
            max-height: calc(100dvh - 174px);
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player-wall-area {
            order: 3;
            align-self: center;
            justify-content: center;
        }

        .wall-section-title {
            font-size: 11px;
            margin: 0 0 2px;
            padding-bottom: 2px;
            line-height: 1.05;
        }

        .wall-list {
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 4px;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;

const SUPABASE_CONFIG = {
    enabled: true,
    url: 'https://llrqcuzzgvufgdobmqps.supabase.co',
    publishableKey: 'sb_publishable_zgjPuVjW2HDK2JYdkfpu-w_GllddGs5',
    experienceFunction: 'ai-experience'
};

let supabaseClient = null;
let supabaseExperienceUser = null;
let supabaseExperienceReady = false;
let sharedAIPatterns = [];
let sharedAIPatternsLoadedAt = 0;
const SHARED_AI_PATTERN_CACHE_MS = 60 * 1000;
const SHARED_AI_PATTERN_LIMIT = 1200;

function isSupabaseConfigured() {
    return !!(
        SUPABASE_CONFIG.enabled &&
        SUPABASE_CONFIG.url &&
        SUPABASE_CONFIG.publishableKey &&
        !SUPABASE_CONFIG.url.includes('YOUR_SUPABASE_') &&
        !SUPABASE_CONFIG.publishableKey.includes('YOUR_SUPABASE_') &&
        window.supabase
    );
}

async function initializeSupabaseExperience() {
    if(!isSupabaseConfigured()) {
        supabaseExperienceReady = false;
        return false;
    }

    try {
        supabaseClient = window.supabase.createClient(
            SUPABASE_CONFIG.url,
            SUPABASE_CONFIG.publishableKey,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: false
                }
            }
        );

        const existing = await supabaseClient.auth.getSession();
        supabaseExperienceUser = existing?.data?.session?.user || null;

        if(!supabaseExperienceUser) {
            const { data, error } = await supabaseClient.auth.signInAnonymously();
            if(error) throw error;
            supabaseExperienceUser = data?.user || data?.session?.user || null;
        }

        supabaseExperienceReady = !!supabaseExperienceUser;
        if(supabaseExperienceReady) {
            await loadSharedAIPatterns(true);
        }
        return supabaseExperienceReady;
    } catch(error) {
        supabaseExperienceReady = false;
        console.warn('Supabase共有AI初期化失敗。ローカル学習のみで続行します:', error);
        return false;
    }
}

function getSharedPatternPersonalitySet() {
    return [...new Set(
        ['player', 'enemy']
            .map(who => getSelectedPersonality(who))
            .filter(Boolean)
    )];
}

async function loadSharedAIPatterns(force = false) {
    if(!supabaseExperienceReady || !supabaseClient) return [];
    if(!force && (Date.now() - sharedAIPatternsLoadedAt) < SHARED_AI_PATTERN_CACHE_MS) {
        return sharedAIPatterns;
    }

    try {
        const personalities = getSharedPatternPersonalitySet();
        if(!personalities.length) return sharedAIPatterns;

        const { data, error } = await supabaseClient
            .from('ai_patterns')
            .select('personality, pattern_type, signature, action_key, bad_action, good_action, wins, losses, confidence, sample_count, updated_at')
            .in('personality', personalities)
            .order('updated_at', { ascending: false })
            .limit(SHARED_AI_PATTERN_LIMIT);

        if(error) throw error;
        sharedAIPatterns = Array.isArray(data) ? data : [];
        sharedAIPatternsLoadedAt = Date.now();
        return sharedAIPatterns;
    } catch(error) {
        console.warn('共有AIパターン取得失敗:', error);
        return sharedAIPatterns;
    }
}

function clampInt(value, min, max) {
    const n = Number.isFinite(Number(value)) ? Number(value) : 0;
    return Math.max(min, Math.min(max, Math.round(n)));
}

function bucketDistance(value) {
    if(value === null || value === undefined || !Number.isFinite(Number(value))) return 9;
    const n = Number(value);
    if(n <= 1) return n;
    if(n <= 3) return 2;
    if(n <= 5) return 3;
    if(n <= 7) return 4;
    return 5;
}

function bucketSigned(value) {
    if(value === null || value === undefined || !Number.isFinite(Number(value))) return 9;
    const n = Number(value);
    if(n <= -4) return -4;
    if(n >= 4) return 4;
    return Math.round(n);
}

function buildSharedSituationSignature(situation) {
    const self = situation?.selfPosition || { r: 0, c: 0 };
    const opp = situation?.opponentPosition || { r: 0, c: 0 };
    const route = situation?.routeSummary || {};
    return {
        boardSize: Number(situation?.boardSize || boardSize || 9),
        selfDistance: bucketDistance(route.selfShortest),
        opponentDistance: bucketDistance(route.opponentShortest),
        distanceGap: bucketSigned(situation?.distanceGap),
        relativeRow: clampInt((self.r ?? 0) - (opp.r ?? 0), -4, 4),
        relativeCol: clampInt((self.c ?? 0) - (opp.c ?? 0), -4, 4),
        selfRoutes: clampInt(route.selfRouteCount, 0, 4),
        opponentRoutes: clampInt(route.opponentRouteCount, 0, 4),
        selfSecondRouteDelta: bucketDistance(
            route.selfSecondRoute !== null && route.selfShortest !== null
                ? route.selfSecondRoute - route.selfShortest : null
        ),
        opponentSecondRouteDelta: bucketDistance(
            route.opponentSecondRoute !== null && route.opponentShortest !== null
                ? route.opponentSecondRoute - route.opponentShortest : null
        ),
        selfThirdRouteDelta: bucketDistance(
            route.selfThirdRoute !== null && route.selfShortest !== null
                ? route.selfThirdRoute - route.selfShortest : null
        ),
        opponentThirdRouteDelta: bucketDistance(
            route.opponentThirdRoute !== null && route.opponentShortest !== null
                ? route.opponentThirdRoute - route.opponentShortest : null
        ),
        selfWalls: clampInt(situation?.selfWallCount, 0, 6),
        opponentWalls: clampInt(situation?.opponentWallCount, 0, 6)
    };
}

function wallOrientationAndRelative(wall, selfPos) {
    const segments = wall?.segments || [];
    if(!segments.length) return { orientation: 'N', dr: 0, dc: 0 };
    const horizontal = segments.every(seg => seg.r1 === seg.r2);
    const vertical = segments.every(seg => seg.c1 === seg.c2);
    const rVals = segments.flatMap(seg => [seg.r1, seg.r2]);
    const cVals = segments.flatMap(seg => [seg.c1, seg.c2]);
    const mr = rVals.reduce((a,b)=>a+b,0) / rVals.length;
    const mc = cVals.reduce((a,b)=>a+b,0) / cVals.length;
    return {
        orientation: horizontal ? 'H' : (vertical ? 'V' : 'M'),
        dr: clampInt(mr - (selfPos?.r ?? 0), -4, 4),
        dc: clampInt(mc - (selfPos?.c ?? 0), -4, 4)
    };
}

function getSharedActionKey(who, action) {
    if(!action) return 'unknown';
    const selfPos = who === 'player' ? playerPos : enemyPos;
    if(action.type === 'move') {
        const to = action.to || action.move;
        if(!to) return 'move:unknown';
        const dr = clampInt(to.r - selfPos.r, -1, 1);
        const dc = clampInt(to.c - selfPos.c, -1, 1);
        return `move:${dr}:${dc}`;
    }
    if(action.type === 'wall') {
        const wall = action.wall || action.wallInfo || {};
        const rel = wallOrientationAndRelative(wall, selfPos);
        const type = wall.type || 'wall';
        return `wall:${type}:${rel.orientation}:${rel.dr}:${rel.dc}`;
    }
    return String(action.type || 'unknown');
}

function getSharedSimilarity(a, b) {
    if(!a || !b) return 0;
    const fields = [
        ['boardSize', 1.0],
        ['selfDistance', 1.4],
        ['opponentDistance', 1.5],
        ['distanceGap', 1.8],
        ['relativeRow', 1.2],
        ['relativeCol', 1.2],
        ['selfRoutes', 1.1],
        ['opponentRoutes', 1.2],
        ['selfSecondRouteDelta', 0.8],
        ['opponentSecondRouteDelta', 1.0],
        ['selfThirdRouteDelta', 0.6],
        ['opponentThirdRouteDelta', 0.8],
        ['selfWalls', 0.5],
        ['opponentWalls', 0.5]
    ];
    let total = 0;
    let hit = 0;
    for(const [key, weight] of fields) {
        if(a[key] === undefined || b[key] === undefined) continue;
        total += weight;
        if(a[key] === b[key]) hit += weight;
        else if(Number.isFinite(Number(a[key])) && Number.isFinite(Number(b[key]))) {
            const diff = Math.abs(Number(a[key]) - Number(b[key]));
            if(diff === 1) hit += weight * 0.45;
        }
    }
    return total > 0 ? hit / total : 0;
}

function getSharedLearningPersonalityWeight(personality) {
    const map = {
        universal: 1.0,
        ambush: 1.05,
        trap: 1.12,
        fortress: 1.08,
        rush: 1.0,
        trickster: 0.72,
        comeback: 1.18,
        patient: 1.35
    };
    return map[personality] || 1.0;
}

function getSharedExperienceScore(who, action, situation = null) {
    const personality = getSelectedPersonality(who);
    if(!personality || !sharedAIPatterns.length) return 0;

    const sourceSituation = situation || buildAIExperienceSituation(who);
    const signature = buildSharedSituationSignature(sourceSituation);
    const actionKey = getSharedActionKey(who, action);
    let best = 0;
    let bestSimilarity = 0;

    for(const pattern of sharedAIPatterns) {
        if(pattern.personality !== personality) continue;
        if(pattern.pattern_type !== 'action_outcome') continue;
        if(pattern.action_key !== actionKey) continue;

        const ps = typeof pattern.signature === 'string'
            ? (() => { try { return JSON.parse(pattern.signature); } catch(e) { return null; } })()
            : pattern.signature;
        const similarity = getSharedSimilarity(signature, ps);
        if(similarity < 0.58) continue;

        const wins = Number(pattern.wins || 0);
        const losses = Number(pattern.losses || 0);
        const samples = wins + losses;
        if(samples <= 0) continue;

        const confidence = Math.max(0, Math.min(1, Number(pattern.confidence ?? 0.5)));
        const empirical = (wins - losses) / samples;
        const strength = (0.35 + similarity * 0.65) * (0.35 + confidence * 0.65);
        const value = empirical * 110 * strength * getSharedLearningPersonalityWeight(personality);
        if(similarity > bestSimilarity || Math.abs(value) > Math.abs(best)) {
            bestSimilarity = similarity;
            best = value;
        }
    }

    return Math.max(-120, Math.min(120, best));
}

async function syncAIExperienceMatchToSupabase(match) {
    if(!supabaseExperienceReady || !supabaseClient || !match) return false;
    try {
        const payload = JSON.parse(JSON.stringify(match));
        const { data, error } = await supabaseClient.functions.invoke(
            SUPABASE_CONFIG.experienceFunction,
            { body: payload }
        );
        if(error) throw error;
        if(data?.ok === false) throw new Error(data.message || 'AI経験送信失敗');
        sharedAIPatternsLoadedAt = 0;
        await loadSharedAIPatterns(true);
        console.log('共有AI経験をSupabaseへ送信:', data);
        return true;
    } catch(error) {
        console.warn('共有AI経験送信失敗。ローカル保存は維持します:', error);
        return false;
    }
}

const AI_EXPERIENCE_STORAGE_KEY = 'taigann_ai_experience_v1';
const AI_EXPERIENCE_MAX_MATCHES = 80;
const AI_EXPERIENCE_MAX_ACTIONS_PER_MATCH = 180;

let aiExperienceMatch = null;

function createExperienceMatchId() {
    return `m_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
}

function getExperienceWallsSignature(walls = placedWalls) {
    return (walls || []).map(w => ({
        owner: w.owner || null,
        type: w.type || null,
        segments: (w.segments || []).map(seg => ({
            r1: seg.r1, c1: seg.c1, r2: seg.r2, c2: seg.c2
        }))
    }));
}

function getExperiencePosition(pos) {
    return pos ? { r: pos.r, c: pos.c } : null;
}

function getExperienceRouteSummary(who) {
    const state = getMyState(who);
    const myPath = getShortestPath(state.myPos, state.myTargetRow, placedWalls);
    const oppPath = getShortestPath(state.oppPos, state.oppTargetRow, placedWalls);
    const myBranches = getRouteBranchProfile(who, placedWalls);
    const opponent = who === 'player' ? 'enemy' : 'player';
    const oppBranches = getRouteBranchProfile(opponent, placedWalls);
    return {
        selfShortest: myPath ? myPath.length - 1 : null,
        opponentShortest: oppPath ? oppPath.length - 1 : null,
        selfRouteCount: myBranches.count,
        selfSecondRoute: myBranches.second < 999 ? myBranches.second : null,
        selfThirdRoute: myBranches.third < 999 ? myBranches.third : null,
        opponentRouteCount: oppBranches.count,
        opponentSecondRoute: oppBranches.second < 999 ? oppBranches.second : null,
        opponentThirdRoute: oppBranches.third < 999 ? oppBranches.third : null
    };
}

function buildAIExperienceSituation(who) {
    const opponent = who === 'player' ? 'enemy' : 'player';
    const summary = getExperienceRouteSummary(who);
    return {
        turn: totalTurnCount,
        actor: who,
        personality: getSelectedPersonality(who),
        aiMode: getSelectedAIMode(who),
        selfPosition: getExperiencePosition(who === 'player' ? playerPos : enemyPos),
        opponentPosition: getExperiencePosition(opponent === 'player' ? playerPos : enemyPos),
        selfWallCount: (who === 'player' ? playerWalls : enemyWalls).length,
        opponentWallCount: (opponent === 'player' ? playerWalls : enemyWalls).length,
        boardSize,
        distanceGap: (summary.opponentShortest ?? 999) - (summary.selfShortest ?? 999),
        routeSummary: summary,
        walls: getExperienceWallsSignature()
    };
}

function beginAIExperienceMatch(firstTurn) {
    aiExperienceMatch = {
        schemaVersion: 1,
        matchId: createExperienceMatchId(),
        startedAt: new Date().toISOString(),
        gameMode,
        boardSize,
        firstTurn,
        players: {
            player: {
                role: p1Difficulty === 'human' ? 'human' : 'ai',
                personality: p1Difficulty === 'human' ? null : p1Personality,
                aiMode: p1Difficulty === 'human' ? null : p1AIMode
            },
            enemy: {
                role: p2Difficulty === 'human' ? 'human' : 'ai',
                personality: p2Difficulty === 'human' ? null : p2Personality,
                aiMode: p2Difficulty === 'human' ? null : p2AIMode
            }
        },
        actions: [],
        result: null
    };
}

function ensureAIExperienceMatch() {
    if(!aiExperienceMatch) beginAIExperienceMatch(currentTurn);
    return aiExperienceMatch;
}

function recordAIExperienceAction(who, action) {
    const match = ensureAIExperienceMatch();
    if(match.actions.length >= AI_EXPERIENCE_MAX_ACTIONS_PER_MATCH) return;

    const state = buildAIExperienceSituation(who);
    const entry = {
        index: match.actions.length,
        turn: totalTurnCount,
        actor: who,
        actorRole: (who === 'player' ? p1Difficulty : p2Difficulty) === 'human' ? 'human' : 'ai',
        personality: (who === 'player' ? p1Difficulty : p2Difficulty) === 'human'
            ? null : getSelectedPersonality(who),
        aiMode: (who === 'player' ? p1Difficulty : p2Difficulty) === 'human'
            ? null : getSelectedAIMode(who),
        before: state,
        situationSignature: buildSharedSituationSignature(state),
        actionKey: getSharedActionKey(who, action),
        action: action
    };
    match.actions.push(entry);
}

function finalizeAIExperienceMatch(winner) {
    if(!aiExperienceMatch) return;

    aiExperienceMatch.endedAt = new Date().toISOString();
    aiExperienceMatch.totalTurns = totalTurnCount;
    aiExperienceMatch.winner = winner;
    aiExperienceMatch.result = {
        winner,
        playerWinner: winner === 'player',
        enemyWinner: winner === 'enemy'
    };

    // 試合終了時の最終局面も残す。次段階で「負け方の特徴量」に利用する。
    aiExperienceMatch.finalState = {
        playerPosition: getExperiencePosition(playerPos),
        enemyPosition: getExperiencePosition(enemyPos),
        walls: getExperienceWallsSignature(),
        totalTurns: totalTurnCount
    };

    const completedMatch = JSON.parse(JSON.stringify(aiExperienceMatch));

    try {
        const raw = localStorage.getItem(AI_EXPERIENCE_STORAGE_KEY);
        const history = raw ? JSON.parse(raw) : [];
        const safeHistory = Array.isArray(history) ? history : [];
        safeHistory.push(completedMatch);
        while(safeHistory.length > AI_EXPERIENCE_MAX_MATCHES) safeHistory.shift();
        localStorage.setItem(AI_EXPERIENCE_STORAGE_KEY, JSON.stringify(safeHistory));
    } catch(e) {
        console.warn('AI対戦経験の保存失敗:', e);
    }

    // 全プレイヤー共通のAI経験へ送る。失敗してもゲーム結果やローカル学習には影響させない。
    void syncAIExperienceMatchToSupabase(completedMatch);
}

function getRecentAIExperience(limit = AI_EXPERIENCE_MAX_MATCHES) {
    try {
        const raw = localStorage.getItem(AI_EXPERIENCE_STORAGE_KEY);
        const history = raw ? JSON.parse(raw) : [];
        return Array.isArray(history) ? history.slice(-limit) : [];
    } catch(e) {
        console.warn('AI対戦経験の読み込み失敗:', e);
        return [];
    }
}

function clearAIExperienceHistory() {
    try {
        localStorage.removeItem(AI_EXPERIENCE_STORAGE_KEY);
    } catch(e) {
        console.warn('AI対戦経験の削除失敗:', e);
    }
}


function resolvePersonality(selection) {
    if(selection && selection !== 'random') return selection;
    const keys = Object.keys(AI_PERSONALITIES);
    return keys[Math.floor(Math.random() * keys.length)];
}

function getSelectedAIMode(who) {
    return who === 'player' ? p1AIMode : p2AIMode;
}

function getSelectedPersonality(who) {
    return who === 'player' ? p1Personality : p2Personality;
}

function getPersonalityName(personality) {
    return AI_PERSONALITIES[personality]?.name || '万能型';
}

function getAIDisplayName(who) {
    const isRandom = who === 'player' ? p1PersonalityRandom : p2PersonalityRandom;
    if(isRandom) return '？？型AI';
    return `${getPersonalityName(getSelectedPersonality(who))}AI`;
}

function getTurnDisplayName(turn) {
    if(turn === 'player') {
        if(p1Difficulty === 'human') return gameMode === 'pve' ? 'あなた' : 'プレイヤー1';
        return getAIDisplayName('player');
    }
    if(p2Difficulty === 'human') return 'プレイヤー2';
    return getAIDisplayName('enemy');
}

function showTurnTransition(nextTurn, endText = 'ターン終了') {
    if(gameEnded) return;
    const gameScreen = document.getElementById('game-screen');
    const overlay = document.getElementById('turn-transition');
    if(!gameScreen || !overlay) {
        startTurn(nextTurn);
        return;
    }

    clearInterval(timerInterval);
    turnTransitioning = true;
    gameScreen.classList.add('turn-changing');

    const nextName = getTurnDisplayName(nextTurn);
    const endEl = document.getElementById('turn-transition-end');
    const nextEl = document.getElementById('turn-transition-next');
    const subEl = document.getElementById('turn-transition-sub');

    if(endEl) endEl.innerText = endText;
    if(nextEl) nextEl.innerText = `${nextName}のターン`;
    if(subEl) subEl.innerText = '次のターンへ切り替えています…';
    overlay.classList.add('show');

    setTimeout(() => {
        overlay.classList.remove('show');
        gameScreen.classList.remove('turn-changing');
        turnTransitioning = false;
        if(gameEnded) return;
        startTurn(nextTurn);
    }, gameMode === 'eve' ? 180 : 850);
}

function createDefaultAIProfile(personality) {
    const base = AI_PERSONALITIES[personality] || AI_PERSONALITIES.universal;
    return {
        generation: 1,
        games: 0,
        wins: 0,
        strategyWins: {},
        strategyGames: {},
        moveGames: {},
        moveWins: {},
        moveWeights: {
            progress: 1.00, safe: 1.00, flexible: 1.00, lure: 1.00,
            ambush: 1.00, wait: 1.00, comeback: 1.00, finish: 1.00
        },
        patternMemory: [],
        weights: { ...base.weights }
    };
}

function loadAIProfile(personality, who = null) {
    const key = who ? `taigann_ai_profile_${personality}_${who}` : `taigann_ai_profile_${personality}`;
    try {
        const saved = localStorage.getItem(key);
        if(saved) {
            const parsed = JSON.parse(saved);
            if(parsed && parsed.weights) {
                return {
                    ...createDefaultAIProfile(personality),
                    ...parsed,
                    weights: {
                        ...createDefaultAIProfile(personality).weights,
                        ...parsed.weights
                    }
                };
            }
        }
    } catch(e) {
        console.warn('AIプロフィール読み込み失敗:', e);
    }
    return createDefaultAIProfile(personality);
}

function saveAIProfile(personality, profile, who = null) {
    try {
        const key = who ? `taigann_ai_profile_${personality}_${who}` : `taigann_ai_profile_${personality}`;
        localStorage.setItem(key, JSON.stringify(profile));
    } catch(e) {
        console.warn('AIプロフィール保存失敗:', e);
    }
}

function getAIProfile(who) {
    // 同じ性格でもP1とP2は別個体。重み・勝敗・学習結果を共有しない。
    const personality = (who === 'player') ? p1Personality : p2Personality;
    const key = who === 'player' ? 'player' : 'enemy';
    if(!aiProfiles[key]) aiProfiles[key] = loadAIProfile(personality, key);
    return aiProfiles[key];
}

function updateEvolutionBadge() {
    const badge = document.getElementById('generation-count');
    const active = [];
    if(p1Difficulty === 'special') active.push(getAIProfile('player')?.generation || 1);
    if(p2Difficulty === 'special') active.push(getAIProfile('enemy')?.generation || 1);
    if(badge) badge.innerText = active.length ? Math.max(...active) : 1;
}

function rememberAIPattern(who, profile, won) {
    const st = aiLearningState[who];
    if(!st || !profile) return;
    const signature = st.lastObservedSignature || getAISignature(who);
    profile.patternMemory = profile.patternMemory || [];
    profile.patternMemory.push({
        signature,
        result: won ? 'win' : 'loss',
        strategy: st.strategy || 'race',
        actionType: st.lastActionType || 'unknown',
        move: st.lastActionMove ? { ...st.lastActionMove } : null,
        wall: st.lastActionWall || null,
        turn: totalTurnCount
    });
    // 1個体につき直近の失敗・成功を十分な数だけ保持。
    if(profile.patternMemory.length > 120) profile.patternMemory.splice(0, profile.patternMemory.length - 120);
}

function evolveAIForResult(winner) {
    ['player', 'enemy'].forEach(who => {
        const diff = (who === 'player') ? p1Difficulty : p2Difficulty;
        if(diff === 'human') return;

        const personality = (who === 'player') ? p1Personality : p2Personality;
        const profile = getAIProfile(who);
        const won = winner === who;
        rememberAIPattern(who, profile, won);
        profile.games++;
        if(won) profile.wins++;

        const strategy = aiLearningState[who].strategy;
        if(strategy) {
            profile.strategyGames[strategy] = (profile.strategyGames[strategy] || 0) + 1;
            if(won) profile.strategyWins[strategy] = (profile.strategyWins[strategy] || 0) + 1;
        }

        if(strategy && profile.weights[strategy] !== undefined) {
            // 勝った戦略を強化、負けた戦略を抑える。
            // ただし一気に単一戦略へ収束させず、性格の尖りは残す。
            const delta = won ? 0.055 : -0.026;
            profile.weights[strategy] = Math.max(0.30, Math.min(2.20, profile.weights[strategy] + delta));
        }

        // 成績の良い戦略を少しだけ学習する。
        Object.keys(profile.strategyGames).forEach(key => {
            if(profile.weights[key] === undefined) return;
            const games = profile.strategyGames[key];
            const wins = profile.strategyWins[key] || 0;
            if(games >= 3) {
                const rate = wins / games;
                profile.weights[key] += (rate - 0.5) * 0.025;
                profile.weights[key] = Math.max(0.30, Math.min(2.20, profile.weights[key]));
            }
        });

        // 駒の動かし方も学習する。
        const moveFeatures = aiLearningState[who].moveFeatures;
        if(moveFeatures) {
            Object.keys(moveFeatures).forEach(key => {
                if(moveFeatures[key] === undefined) return;
                profile.moveGames[key] = (profile.moveGames[key] || 0) + 1;
                if(won) profile.moveWins[key] = (profile.moveWins[key] || 0) + 1;
                if(profile.moveWeights[key] !== undefined) {
                    profile.moveWeights[key] += (won ? 0.035 : -0.015) * moveFeatures[key];
                    profile.moveWeights[key] = Math.max(0.35, Math.min(2.00, profile.moveWeights[key]));
                }
            });
        }

        // ノーマルモードでも学習する。特に熟考型は「勝った道／負けた道」の記録を強める。
        const selectedMode = getSelectedAIMode(who);
        if(personality === 'patient' || selectedMode === 'normal') {
            if(won) profile.weights.patience = Math.min(2.20, profile.weights.patience + 0.035);
            else profile.weights.patience = Math.max(0.30, profile.weights.patience - 0.018);
            if(personality === 'patient' && !won) {
                const failedStrategy = strategy || 'race';
                if(profile.weights[failedStrategy] !== undefined) {
                    profile.weights[failedStrategy] = Math.max(0.30, profile.weights[failedStrategy] - 0.035);
                }
            }
        }

        // 世代更新。ゲームを重ねるほど微調整幅が小さくなり、安定した強い方へ収束する。
        if(profile.games % 3 === 0) {
            profile.generation++;
            Object.keys(profile.weights).forEach(key => {
                const base = AI_PERSONALITIES[personality].weights[key];
                profile.weights[key] += (base - profile.weights[key]) * 0.08;
                profile.weights[key] = Math.max(0.30, Math.min(2.20, profile.weights[key]));
            });
        }
        saveAIProfile(personality, profile, who);
    });
    updateEvolutionBadge();
}

function startGame(firstTurn) {
    playerPos = {r: boardSize - 1, c: Math.floor(boardSize / 2)};
    enemyPos = {r: 0, c: Math.floor(boardSize / 2)};

    playerWalls = generateWalls();
    enemyWalls = generateWalls();
    placedWalls = [];
    totalTurnCount = 0;
    rotationAngle = 0;
    gameEnded = false;
    mobileWallCursorR = Math.floor(boardSize / 2);
    mobileWallCursorC = Math.floor(boardSize / 2);

    aiProfiles = {};
    aiLearningState = {
        player: createEmptyAILearningState(),
        enemy: createEmptyAILearningState()
    };
    if(p1Difficulty === 'special') aiProfiles.player = loadAIProfile(p1Personality, 'player');
    if(p2Difficulty === 'special') aiProfiles.enemy = loadAIProfile(p2Personality, 'enemy');

    // 第1段階の対戦記録を開始。ゲーム本体のAI判断はこの記録機構から独立して動く。
    beginAIExperienceMatch(firstTurn);
    updateEvolutionBadge();

    // UIのラベル調整
    const p1Area = document.getElementById('player-wall-area');
    const p2Area = document.getElementById('enemy-wall-area');
    const p1Title = document.getElementById('p1-title');
    const p2Title = document.getElementById('p2-title');

    if (gameMode === 'pve') {
        p1Title.innerText = "プレイヤーの壁 (橙)";
        p2Title.innerText = "AIの壁 (黒)";
        p1Area.classList.add('interactive-wall');
        p2Area.classList.remove('interactive-wall');
    } else if (gameMode === 'pvp') {
        p1Title.innerText = "プレイヤー1の壁 (橙)";
        p2Title.innerText = "プレイヤー2の壁 (黒)";
        p1Area.classList.add('interactive-wall');
        p2Area.classList.add('interactive-wall');
    } else {
        p1Title.innerText = `${getAIDisplayName('player')}の壁 (橙)`;
        p2Title.innerText = `${getAIDisplayName('enemy')}の壁 (黒)`;
        p1Area.classList.remove('interactive-wall');
        p2Area.classList.remove('interactive-wall');
    }

    // 先に人間操作判定を作る。
    // 旧版では isP2Human を宣言する前に参照していたため、
    // コイントス終了後の startGame() で ReferenceError が発生し、
    // 対戦画面へ進めない不具合があった。
    const isP1Human = (p1Difficulty === 'human');
    const isP2Human = (p2Difficulty === 'human');

    const playerRotateBtn = document.getElementById('rotate-wall-btn');
    if(playerRotateBtn) playerRotateBtn.style.display = isP1Human ? 'inline-block' : 'none';

    const enemyRotateBtn = document.getElementById('rotate-enemy-wall-btn');
    if(enemyRotateBtn) enemyRotateBtn.style.display = isP2Human ? 'inline-block' : 'none';

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';

    resizeBoardForViewport();
    initBoard();
    resizeBoardForViewport();
    updateWallsUI();
    renderPlacedWalls();

    // 初回は匿名認証＋共有経験の読み込みを行う。
    // ネットワークが遅くても3秒でゲーム開始へ進む。
    const sharedInit = initializeSupabaseExperience();
    const sharedTimeout = new Promise(resolve => setTimeout(resolve, 3000));
    Promise.race([sharedInit, sharedTimeout]).finally(() => {
        if(!gameEnded) startTurn(firstTurn);
    });
}

function getInitialWallCount(size = boardSize) {
    switch(Number(size)) {
        case 5: return 5;
        case 7: return 7;
        case 9: return 10;
        case 11: return 12;
        default: return 10;
    }
}

function generateWalls() {
    const wallCount = getInitialWallCount(boardSize);
    let list = [];
    if (wallMode === 'normal') {
        for(let i=0; i<wallCount; i++) {
            list.push({ type: 'STRAIGHT_2', len: 2 });
        }
    } else {
        const keys = Object.keys(DYNAMIC_WALL_DEFINITIONS);
        for(let i=0; i<wallCount; i++) {
            const key = keys[Math.floor(Math.random() * keys.length)];
            list.push({ type: key, len: DYNAMIC_WALL_DEFINITIONS[key].len });
        }
    }
    return list;
}

function resizeBoardForViewport() {
    const board = document.getElementById('board');
    if(!board) return;

    const isMobile = window.matchMedia('(max-width: 700px)').matches;
    if(!isMobile) {
        CELL_SIZE = 42;
    } else {
        const viewportWidth = window.visualViewport ? window.visualViewport.width : window.innerWidth;
        const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        // 上部UI・敵壁・自分壁を差し引き、残った正方形領域に盤面を収める。
        const availableWidth = Math.max(1, viewportWidth - 14);
        const availableHeight = Math.max(1, viewportHeight - 150);
        const maxBoardPx = Math.min(availableWidth, availableHeight);
        const usableCell = (maxBoardPx - (boardSize - 1) * WALL_THICK) / boardSize;
        // 画面が非常に小さい場合でも盤面を画面外へ押し出さない。
        CELL_SIZE = Math.max(8, Math.floor(usableCell));
    }

    const totalPx = boardSize * CELL_SIZE + (boardSize - 1) * WALL_THICK;
    board.style.width = totalPx + 'px';
    board.style.height = totalPx + 'px';
    board.style.gridTemplateColumns = `repeat(${boardSize}, ${CELL_SIZE}px)`;
    board.style.gridTemplateRows = `repeat(${boardSize}, ${CELL_SIZE}px)`;
    board.style.gap = `${WALL_THICK}px`;

    const svgLayer = document.getElementById('wall-svg-layer');
    const previewLayer = document.getElementById('wall-preview-overlay');
    [svgLayer, previewLayer].forEach(layer => {
        if(layer) {
            layer.style.width = totalPx + 'px';
            layer.style.height = totalPx + 'px';
            layer.setAttribute('viewBox', `0 0 ${totalPx} ${totalPx}`);
        }
    });

    renderPlacedWalls();
}

function groupWalls(wallList) {
    const groups = {};
    wallList.forEach(w => {
        const key = `${w.type}_${w.len}`;
        if(!groups[key]) {
            groups[key] = { type: w.type, len: w.len, count: 0, key: key };
        }
        groups[key].count++;
    });
    return groups;
}

function createWallShapeSVG(type, len, isPlayer = true) {
    const def = DYNAMIC_WALL_DEFINITIONS[type] || DYNAMIC_WALL_DEFINITIONS['STRAIGHT_2'];
    const pts = def.points;

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    pts.forEach(p => {
        if(p.x < minX) minX = p.x;
        if(p.x > maxX) maxX = p.x;
        if(p.y < minY) minY = p.y;
        if(p.y > maxY) maxY = p.y;
    });

    const scale = 10;
    const pad = 8;
    const w = (maxX - minX) * scale + pad * 2;
    const h = (maxY - minY) * scale + pad * 2;

    let pathD = '';
    pts.forEach((p, idx) => {
        const sx = (p.x - minX) * scale + pad;
        const sy = (p.y - minY) * scale + pad;
        pathD += (idx === 0 ? 'M' : 'L') + `${sx},${sy} `;
    });

    const strokeColor = isPlayer ? "#ff8c00" : "#555555";
    return `<svg width="50" height="36" viewBox="0 0 ${Math.max(w, 36)} ${Math.max(h, 36)}"><path d="${pathD}" stroke="${strokeColor}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function updateWallsUI() {
    const pContainer = document.getElementById('player-walls');
    const eContainer = document.getElementById('enemy-walls');
    pContainer.innerHTML = '';
    eContainer.innerHTML = '';

    const pGroup = groupWalls(playerWalls);
    const eGroup = groupWalls(enemyWalls);

    const isP1Human = (p1Difficulty === 'human');
    const isP2Human = (p2Difficulty === 'human');

    Object.values(pGroup).forEach(group => {
        if(group.count <= 0) return;
        const item = document.createElement('div');
        item.className = `wall-item ${selectedWallTypeKey === group.key && currentTurn === 'player' ? 'selected' : ''}`;
        
        const iconBox = document.createElement('div');
        iconBox.className = 'wall-icon-container';
        iconBox.innerHTML = createWallShapeSVG(group.type, group.len, true);

        const countBox = document.createElement('div');
        countBox.className = 'wall-count';
        countBox.innerText = `×${group.count}`;

        item.appendChild(iconBox);
        item.appendChild(countBox);

        if (isP1Human) {
            item.onclick = (e) => {
                e.stopPropagation();
                if(currentTurn !== 'player') return;

                // 壁を選択中は、解除ボタンを押すまで別の壁へ変更・選択解除をしない。
                if(isMobilePlacementMode() && selectedWallTypeKey !== null) return;

                if(isMoveWaiting) {
                    isMoveWaiting = false;
                    clearBlink();
                }

                selectedWallTypeKey = group.key;
                initializeMobileWallCursor();
                updateWallsUI();
            };
        }

        pContainer.appendChild(item);
    });

    Object.values(eGroup).forEach(group => {
        if(group.count <= 0) return;
        const item = document.createElement('div');
        item.className = `wall-item ${selectedWallTypeKey === group.key && currentTurn === 'enemy' ? 'selected' : ''}`;

        const iconBox = document.createElement('div');
        iconBox.className = 'wall-icon-container';
        iconBox.innerHTML = createWallShapeSVG(group.type, group.len, false);

        const countBox = document.createElement('div');
        countBox.className = 'wall-count';
        countBox.innerText = `×${group.count}`;

        item.appendChild(iconBox);
        item.appendChild(countBox);

        if (isP2Human) {
            item.onclick = (e) => {
                e.stopPropagation();
                if(currentTurn !== 'enemy') return;

                // 壁を選択中は、解除ボタンを押すまで別の壁へ変更・選択解除をしない。
                if(isMobilePlacementMode() && selectedWallTypeKey !== null) return;

                if(isMoveWaiting) {
                    isMoveWaiting = false;
                    clearBlink();
                }

                selectedWallTypeKey = group.key;
                initializeMobileWallCursor();
                updateWallsUI();
            };
        }

        eContainer.appendChild(item);
    });

    if(isMobilePlacementMode() && selectedWallTypeKey) {
        updateMobileWallController();
    } else if(!selectedWallTypeKey) {
        hideMobileWallController();
    }
}

function startTurn(turn) {
    if(gameEnded) return;
    currentTurn = turn;
    turnTransitioning = false;
    const gameScreen = document.getElementById('game-screen');
    if(gameScreen) gameScreen.classList.remove('turn-changing');

    selectedWallTypeKey = null;
    isMoveWaiting = false;
    hideMobileWallController();
    clearBlink();
    updateWallsUI();

    // ターン開始時に壁の強制再描画・表示確認を行い、非表示化を防ぐ
    renderPlacedWalls();

    totalTurnCount++;

    const indicator = document.getElementById('turn-indicator');
    const turnName = getTurnDisplayName(turn);

    if(turn === 'player') {
        indicator.innerText = `${turnName}のターン`;
        indicator.style.color = "#ff8c00";
    } else {
        indicator.innerText = `${turnName}のターン`;
        indicator.style.color = "#e74c3c";
    }

    // 現在ターンを常時見失わないよう、表示を強くする。
    indicator.style.fontSize = "24px";
    indicator.style.textShadow = turn === 'player'
        ? "0 0 12px rgba(255,140,0,0.75)"
        : "0 0 12px rgba(231,76,60,0.75)";

    resetTimer();

    const isCurrentAI = (turn === 'player' && p1Difficulty !== 'human') || (turn === 'enemy' && p2Difficulty !== 'human');
    if(isCurrentAI) {
        const diff = (turn === 'player') ? p1Difficulty : p2Difficulty;
        const aiStartDelay = gameMode === 'eve' ? 80 : 500;
        setTimeout(() => {
            if(!gameEnded && currentTurn === turn && !turnTransitioning) runAI(turn, diff);
        }, aiStartDelay);
    }
}

function resetTimer() {
    clearInterval(timerInterval);
    timeLeft = maxTimeLeft;
    document.getElementById('time-left').innerText = timeLeft;
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if(timeLeft <= 0) {
            clearInterval(timerInterval);
            showTurnTransition(currentTurn === 'player' ? 'enemy' : 'player', '時間切れ・ターン終了');
        }
    }, 1000);
}

function updateRotationDisplay() {
    document.querySelectorAll('.rotation-display').forEach(display => {
        display.innerText = `${rotationAngle}°`;
    });
}

function rotateSelectedWall() {
    const isHumanTurn = (currentTurn === 'player' && p1Difficulty === 'human') || (currentTurn === 'enemy' && p2Difficulty === 'human');
    if(!isHumanTurn || turnTransitioning) return;
    rotationAngle = (rotationAngle + 90) % 360;
    updateRotationDisplay();

    if(isMobilePlacementMode() && selectedWallTypeKey) {
        const wallData = getSelectedWallData(currentTurn);
        if(wallData) {
            const bounds = getWallAnchorBounds(wallData, rotationAngle);
            mobileWallCursorR = Math.max(bounds.minR, Math.min(bounds.maxR, mobileWallCursorR));
            mobileWallCursorC = Math.max(bounds.minC, Math.min(bounds.maxC, mobileWallCursorC));
        }
        updateMobileWallController();
    } else {
        clearPreview();
    }
}

window.addEventListener('keydown', (e) => {
    if(e.key === 'r' || e.key === 'R') {
        rotateSelectedWall();
    }
});

window.addEventListener('resize', () => {
    if(document.getElementById('game-screen')?.style.display !== 'none') {
        resizeBoardForViewport();
        if(isMobilePlacementMode() && selectedWallTypeKey) updateMobileWallController();
    }
});

if(window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
        if(document.getElementById('game-screen')?.style.display !== 'none') {
            resizeBoardForViewport();
            if(isMobilePlacementMode() && selectedWallTypeKey) updateMobileWallController();
        }
    });
}


function clearBlink() {
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('blink'));
}

function handleCellClick(r, c) {
    if(gameEnded || turnTransitioning) return;

    // 壁選択中は、盤面の駒・移動先などを操作できない。
    // 解除ボタンで selectedWallTypeKey が null になった後だけ操作可能。
    if(selectedWallTypeKey !== null) return;

    const isHumanTurn = (currentTurn === 'player' && p1Difficulty === 'human') || (currentTurn === 'enemy' && p2Difficulty === 'human');
    if(!isHumanTurn) return;

    const myPos = (currentTurn === 'player') ? playerPos : enemyPos;

    if(r === myPos.r && c === myPos.c) {
        if(selectedWallTypeKey !== null) {
            selectedWallTypeKey = null;
            updateWallsUI();
        }
        isMoveWaiting = !isMoveWaiting;
        if(isMoveWaiting) {
            highlightMoves(myPos);
        } else {
            clearBlink();
        }
        return;
    }

    if(isMoveWaiting) {
        const moves = getValidMoves(myPos);
        if(moves.some(m => m.r === r && m.c === c)) {
            clearBlink();
            isMoveWaiting = false;
            executeMove(currentTurn, {r, c});
        }
    }
}

function highlightMoves(pos) {
    clearBlink();
    if(!isMoveWaiting) return;

    const moves = getValidMoves(pos);
    moves.forEach(m => {
        const cell = document.querySelector(`.cell[data-r="${m.r}"][data-c="${m.c}"]`);
        if(cell) cell.classList.add('blink');
    });
}

function getValidMoves(pos) {
    const dirs = [{r:-1, c:0}, {r:1, c:0}, {r:0, c:-1}, {r:0, c:1}];
    let valid = [];
    dirs.forEach(d => {
        const nr = pos.r + d.r;
        const nc = pos.c + d.c;
        if(nr >= 0 && nr < boardSize && nc >= 0 && nc < boardSize) {
            if(!isWallBlocking(pos, {r: nr, c: nc})) {
                valid.push({r: nr, c: nc});
            }
        }
    });
    return valid;
}

function isWallBlocking(p1, p2) {
    return isWallBlockingWithList(p1, p2, placedWalls);
}

function executeMove(who, target) {
    const st = aiLearningState[who];
    if(st) {
        st.lastObservedSignature = getAISignature(who);
        st.lastActionType = 'move';
        st.lastActionMove = { ...target };
    }
    const other = who === 'player' ? enemyPos : playerPos;
    if(target.r === other.r && target.c === other.c) {
        runCollisionCoinToss(who, target);
        return;
    }

    // 実際に動く前の局面を記録する。人間側の手もAIにとっての観測データになる。
    recordAIExperienceAction(who, {
        type: 'move',
        to: { ...target },
        strategy: aiLearningState[who]?.strategy || null
    });

    if(who === 'player') playerPos = target;
    else enemyPos = target;

    recordAIActionHistory(who, `move:${target.r},${target.c}`);
    recordAIPosition(who, target);

    // 相手が「二択」のどちらを選んだかを記録し、次のAIターンでその枝を狙う。
    const opponentOfMover = who === 'player' ? 'enemy' : 'player';
    const pending = aiLearningState[opponentOfMover]?.pendingTwoChoice;
    if(pending && pending.choices.some(p => p.r === target.r && p.c === target.c)) {
        pending.selected = { ...target };
        pending.observedTurn = totalTurnCount;
    }

    renderPieces();
    if(checkWin(who)) return;

    showTurnTransition(who === 'player' ? 'enemy' : 'player');
}

function checkWin(who) {
    if(who === 'player' && playerPos.r === 0) {
        clearInterval(timerInterval);
        setTimeout(() => triggerWinSequence('player'), 300);
        return true;
    }
    if(who === 'enemy' && enemyPos.r === boardSize - 1) {
        clearInterval(timerInterval);
        setTimeout(() => triggerWinSequence('enemy'), 300);
        return true;
    }
    return false;
}

function triggerWinSequence(winner) {
    clearInterval(timerInterval);
    // 第1段階：対戦全体の経験を1件として保存。
    finalizeAIExperienceMatch(winner);
    evolveAIForResult(winner);
    evolveAIFromObservation(winner);
    // 勝敗が確定した瞬間に盤面の壁を消去し、結果画面を完全に独立させる。
    resetBattleVisuals();
    if (gameMode === 'pve' && winner === 'enemy') {
        triggerLoseSequence();
        return;
    }

    launchConfetti();
    const winTitle = document.getElementById('win-title-text');
    const winnerText = document.getElementById('win-winner-text');

    if (gameMode === 'pvp') {
        winTitle.innerText = "VICTORIA (決着)";
        winnerText.innerText = winner === 'player' ? "【プレイヤー1 (橙)】が" : "【プレイヤー2 (黒)】が";
    } else if (gameMode === 'eve') {
        winTitle.innerText = "MATCH FINISHED (決着)";
        winnerText.innerText = winner === 'player' ? "【AI 1 (橙)】が" : "【AI 2 (黒)】が";
    } else {
        winTitle.innerText = "VICTORIA (勝利)";
        winnerText.innerText = "【あなた】が";
    }

    document.getElementById('win-turn-count').innerText = totalTurnCount;
    const winModal = document.getElementById('win-modal');
    winModal.classList.remove('result-visible');
    void winModal.offsetWidth;
    winModal.classList.add('result-visible');
    winModal.style.display = 'flex';
}

function triggerLoseSequence() {
    // 敗北時も盤面の壁を即時消去。絶望演出は結果画面だけで行う。
    resetBattleVisuals();
    const loseModal = document.getElementById('lose-modal');
    loseModal.classList.remove('result-visible');
    void loseModal.offsetWidth;
    loseModal.classList.add('result-visible');

    document.getElementById('lose-skull-container').innerHTML = SKULL_SVG;
    document.getElementById('lose-turn-count').innerText = totalTurnCount;
    
    const tauntBox = document.getElementById('taunt-list');
    tauntBox.innerHTML = '';
    TAUNT_MESSAGES.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'taunt-item';
        div.innerText = msg;
        tauntBox.appendChild(div);
    });

    document.getElementById('lose-modal').style.display = 'flex';
}

function launchConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    const colors = ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#e67e22', '#9b59b6'];

    for (let i = 0; i < 150; i++) {
        particles.push({
            x: canvas.width / 2,
            y: canvas.height / 2,
            vx: (Math.random() - 0.5) * 18,
            vy: (Math.random() - 0.7) * 18,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            rSpeed: (Math.random() - 0.5) * 10
        });
    }

    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3;
            p.rotation += p.rSpeed;

            if (p.y < canvas.height) alive = true;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
        });

        if (alive) {
            requestAnimationFrame(update);
        } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }
    update();
}

function runCollisionCoinToss(who, target) {
    const modal = document.getElementById('coin-modal');
    const coin = document.getElementById('coin');
    const resultText = document.getElementById('coin-result');
    document.getElementById('coin-title').innerText = "衝突発生！ポジション権利コイントス";
    
    modal.style.display = 'flex';
    coin.classList.add('flip');
    resultText.innerText = "";

    setTimeout(() => {
        const playerWins = Math.random() < 0.5;
        const temp = { ...playerPos };
        playerPos = { ...enemyPos };
        enemyPos = temp;
        
        coin.classList.remove('flip');
        coin.innerText = playerWins ? "表" : "裏";
        resultText.innerText = playerWins ? "プレイヤー1 (橙) が位置を獲得！" : "プレイヤー2 / AI (黒) が位置を獲得！";
        
        renderPieces();

        setTimeout(() => {
            modal.style.display = 'none';
            startTurn(playerWins ? 'player' : 'enemy');
        }, 1500);
    }, 2000);
}

function handleBoardMouseMove(e) {
    if(gameEnded || isMobilePlacementMode()) return;

    const isHumanTurn = (currentTurn === 'player' && p1Difficulty === 'human') || (currentTurn === 'enemy' && p2Difficulty === 'human');
    if(!selectedWallTypeKey || !isHumanTurn) {
        clearPreview();
        return;
    }
    const metrics = getBoardGridMetrics();
    if(!metrics) return;
    const x = e.clientX - metrics.overlayRect.left;
    const y = e.clientY - metrics.overlayRect.top;

    const wallData = getSelectedWallData(currentTurn);
    if(!wallData) return;

    const wallPos = calculateWallPos(x, y, wallData, rotationAngle);
    drawPreview(wallPos);
}

function getSelectedWallData(who) {
    const list = who === 'player' ? playerWalls : enemyWalls;
    if(!selectedWallTypeKey) return null;
    return list.find(w => `${w.type}_${w.len}` === selectedWallTypeKey);
}

function clearPreview() {
    const previewOverlay = document.getElementById('wall-preview-overlay');
    if(previewOverlay) previewOverlay.innerHTML = '';
}

function isMobilePlacementMode() {
    return window.matchMedia && window.matchMedia('(max-width: 700px)').matches;
}

function getMobileWallCursorPosition() {
    const wallData = getSelectedWallData(currentTurn);
    if(!wallData) return null;

    const wallInfo = getWallInfo(mobileWallCursorR, mobileWallCursorC, wallData, rotationAngle);
    return {
        r: mobileWallCursorR,
        c: mobileWallCursorC,
        ...wallInfo,
        isValid: isValidWallPlacement(wallInfo.segments),
        angle: rotationAngle,
        wallData
    };
}

function initializeMobileWallCursor() {
    if(!isMobilePlacementMode() || !selectedWallTypeKey) {
        hideMobileWallController();
        return;
    }

    const wallData = getSelectedWallData(currentTurn);
    if(!wallData) return;
    const bounds = getWallAnchorBounds(wallData, rotationAngle);
    mobileWallCursorR = Math.max(bounds.minR, Math.min(bounds.maxR, Math.floor(boardSize / 2)));
    mobileWallCursorC = Math.max(bounds.minC, Math.min(bounds.maxC, Math.floor(boardSize / 2)));

    // 選択直後は盤面中央付近に緑/赤の壁候補を表示する。
    const wallPos = getMobileWallCursorPosition();
    if(wallPos) drawPreview(wallPos);

    const controller = document.getElementById('mobile-wall-controller');
    if(controller) controller.classList.add('active');
    updateMobileWallController();
}

function updateMobileWallController() {
    const controller = document.getElementById('mobile-wall-controller');
    if(!controller) return;

    const active = isMobilePlacementMode() && !!selectedWallTypeKey && !gameEnded;
    controller.classList.toggle('active', active);

    const wallPos = active ? getMobileWallCursorPosition() : null;
    if(wallPos) {
        drawPreview(wallPos);
    } else if(!active) {
        clearPreview();
    }

    const placeBtn = document.getElementById('mobile-place-wall-btn');
    const rotateBtn = document.getElementById('mobile-rotate-wall-btn');
    if(placeBtn) placeBtn.disabled = !wallPos || !wallPos.isValid;
    if(rotateBtn) rotateBtn.disabled = !active;
}

function hideMobileWallController() {
    const controller = document.getElementById('mobile-wall-controller');
    if(controller) controller.classList.remove('active');

    const placeBtn = document.getElementById('mobile-place-wall-btn');
    if(placeBtn) placeBtn.disabled = true;

    // ミニウィンドウが閉じている間は、緑/赤の壁候補ラインを表示しない。
    if(isMobilePlacementMode()) clearPreview();
}

function cancelWallSelection() {
    if(gameEnded) return;

    // 「解除」は壁選択状態そのものを終了させる。
    selectedWallTypeKey = null;
    isMoveWaiting = false;
    clearBlink();
    clearPreview();
    hideMobileWallController();
    updateWallsUI();
}

function moveMobileWallCursor(dr, dc) {
    if(gameEnded || !isMobilePlacementMode()) return;

    const isHumanTurn =
        (currentTurn === 'player' && p1Difficulty === 'human') ||
        (currentTurn === 'enemy' && p2Difficulty === 'human');

    if(!selectedWallTypeKey || !isHumanTurn || turnTransitioning) return;

    const wallData = getSelectedWallData(currentTurn);
    if(!wallData) return;

    const bounds = getWallAnchorBounds(wallData, rotationAngle);
    mobileWallCursorR = Math.max(bounds.minR, Math.min(bounds.maxR, mobileWallCursorR + dr));
    mobileWallCursorC = Math.max(bounds.minC, Math.min(bounds.maxC, mobileWallCursorC + dc));

    updateMobileWallController();
}

function centerMobileWallCursor() {
    if(gameEnded || !isMobilePlacementMode() || !selectedWallTypeKey) return;
    const wallData = getSelectedWallData(currentTurn);
    if(!wallData) return;
    const bounds = getWallAnchorBounds(wallData, rotationAngle);
    mobileWallCursorR = Math.max(bounds.minR, Math.min(bounds.maxR, Math.floor(boardSize / 2)));
    mobileWallCursorC = Math.max(bounds.minC, Math.min(bounds.maxC, Math.floor(boardSize / 2)));
    updateMobileWallController();
}

function placeMobileWall() {
    if(gameEnded || !isMobilePlacementMode() || !selectedWallTypeKey) return;

    const isHumanTurn =
        (currentTurn === 'player' && p1Difficulty === 'human') ||
        (currentTurn === 'enemy' && p2Difficulty === 'human');

    if(!isHumanTurn || turnTransitioning) return;

    const wallPos = getMobileWallCursorPosition();
    if(!wallPos || !wallPos.isValid) return;

    // 最終設置直前にも根本ルールを再確認する。
    if(!validateWallKeepsBothGoalsReachable(wallPos.segments, placedWalls)) return;

    recordAIExperienceAction(currentTurn, {
        type: 'wall',
        wall: {
            points: wallPos.points,
            segments: wallPos.segments,
            owner: currentTurn
        },
        source: 'human-wall-mobile'
    });

    placedWalls.push({
        points: wallPos.points,
        segments: wallPos.segments,
        owner: currentTurn
    });
    renderPlacedWalls();

    const wallList = currentTurn === 'player' ? playerWalls : enemyWalls;
    const idx = wallList.findIndex(w => `${w.type}_${w.len}` === selectedWallTypeKey);
    if(idx !== -1) wallList.splice(idx, 1);

    selectedWallTypeKey = null;
    clearPreview();
    hideMobileWallController();
    updateWallsUI();

    showTurnTransition(
        currentTurn === 'player' ? 'enemy' : 'player',
        '壁を設置しました'
    );
}

function getWallAnchorBounds(wallData, angle) {
    const def = DYNAMIC_WALL_DEFINITIONS[wallData.type] || DYNAMIC_WALL_DEFINITIONS['STRAIGHT_2'];
    const rotatedPoints = def.points.map(p => {
        let x = p.x, y = p.y;
        if(angle === 90) { x = -p.y; y = p.x; }
        else if(angle === 180) { x = -p.x; y = -p.y; }
        else if(angle === 270) { x = p.y; y = -p.x; }
        return { x, y };
    });

    const minX = Math.min(...rotatedPoints.map(p => p.x));
    const maxX = Math.max(...rotatedPoints.map(p => p.x));
    const minY = Math.min(...rotatedPoints.map(p => p.y));
    const maxY = Math.max(...rotatedPoints.map(p => p.y));

    // アンカー自身ではなく「壁の全頂点」が盤面の格子線 0～N に
    // 収まる範囲を求める。これでスマホ下端で baseR=N にした結果、
    // 壁の一部が N+1 / N+2 に飛び出す問題を根元から防ぐ。
    return {
        minR: -minY,
        maxR: boardSize - maxY,
        minC: -minX,
        maxC: boardSize - maxX
    };
}

function calculateWallPos(x, y, wallData, angle) {
    const metrics = getBoardGridMetrics();
    if(!metrics) return { r: 0, c: 0, points: [], segments: [], isValid: false, angle, wallData };

    const nearestIndex = (value, lines) => {
        let best = 0;
        let bestDist = Infinity;
        for(let i = 0; i < lines.length; i++) {
            const d = Math.abs(value - lines[i]);
            if(d < bestDist) { bestDist = d; best = i; }
        }
        return best;
    };

    const rawC = nearestIndex(x, metrics.colLines);
    const rawR = nearestIndex(y, metrics.rowLines);
    const bounds = getWallAnchorBounds(wallData, angle);

    const baseC = Math.max(bounds.minC, Math.min(bounds.maxC, rawC));
    const baseR = Math.max(bounds.minR, Math.min(bounds.maxR, rawR));

    const wallInfo = getWallInfo(baseR, baseC, wallData, angle);
    const isValid = isValidWallPlacement(wallInfo.segments);

    return { r: baseR, c: baseC, ...wallInfo, isValid, angle, wallData };
}

function getWallInfo(baseR, baseC, wallData, angle) {
    const def = DYNAMIC_WALL_DEFINITIONS[wallData.type] || DYNAMIC_WALL_DEFINITIONS['STRAIGHT_2'];
    const pts = def.points;

    const rotatedPoints = pts.map(p => {
        let rx = p.x, ry = p.y;
        if (angle === 90) { rx = -p.y; ry = p.x; }
        else if (angle === 180) { rx = -p.x; ry = -p.y; }
        else if (angle === 270) { rx = p.y; ry = -p.x; }
        return { x: rx, y: ry };
    });

    const absPoints = rotatedPoints.map(p => ({
        r: baseR + p.y,
        c: baseC + p.x
    }));

    let segments = [];
    for (let i = 0; i < absPoints.length - 1; i++) {
        const p1 = absPoints[i];
        const p2 = absPoints[i + 1];
        if (p1.r === p2.r && p1.c === p2.c) continue; 
        
        const minR = Math.min(p1.r, p2.r);
        const maxR = Math.max(p1.r, p2.r);
        const minC = Math.min(p1.c, p2.c);
        const maxC = Math.max(p1.c, p2.c);

        if (minR === maxR) {
            for (let c = minC; c < maxC; c++) {
                segments.push({ r1: minR, c1: c, r2: minR, c2: c + 1 });
            }
        } else if (minC === maxC) {
            for (let r = minR; r < maxR; r++) {
                segments.push({ r1: r, c1: minC, r2: r + 1, c2: minC });
            }
        }
    }

    return { points: absPoints, segments };
}

function isValidWallPlacement(segments) {
    return isValidWallPlacementWithWalls(segments, placedWalls);
}

// ============================================================
// 根本ルール：壁を置いた後も、現在の両方の駒から各自のゴールまで
// 上下左右だけで到達できる道が最低1本は残っていなければならない。
// 駒を壁と盤面外枠で完全に閉じ込める配置も、ゴールへの全経路を
// 消す配置も、プレイヤー/AIを問わず禁止する。遠回りは合法。
// ============================================================
function isPositionRoutePreserved(position, targetRow, walls) {
    if(!position) return false;
    if(position.r < 0 || position.r >= boardSize ||
       position.c < 0 || position.c >= boardSize) return false;

    // 「今いるマス」から「この駒自身のゴール行」まで、
    // 実際の移動判定と同じ4方向の壁判定で経路を確認する。
    // 最短経路が存在する必要はなく、何手かかっても1本残っていれば合法。
    // 逆に経路が0本になった時点で、その壁配置は即座に不許可。
    return hasPath(position, targetRow, walls);
}

function validateWallKeepsBothGoalsReachable(candidateSegments, baseWalls) {
    if(!Array.isArray(candidateSegments) || candidateSegments.length === 0) return false;
    if(!Array.isArray(baseWalls)) return false;

    // 壁を仮設置した状態を作り、設置前に「現在位置→自分のゴール」を
    // プレイヤー・AIの両方について個別に確認する。
    const testWalls = [...baseWalls, { segments: candidateSegments }];

    const playerPath = getShortestPath(playerPos, 0, testWalls);
    if(!playerPath || playerPath.length === 0) return false;
